<!doctype html>
<html lang="es" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guitarra 12 semanas</title>
<meta name="description" content="Programa de 12 semanas de teoría aplicada y oído para guitarra, con lecciones, ejercicios y seguimiento.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#121215">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guitarra">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Estilo Mesa: grafito casi negro, acento ámbar, fichas con iniciales de color, números en mono.
   Funciones armónicas con color fijo en toda la app: tónica verde, predominante azul, dominante coral. */
:root{--bg:#121215;--side:#0C0C0E;--sf:#1A1A1E;--sf2:#212126;--sf3:#2C2C33;--line:#28282E;--ink:#F3F3F5;--mut:#9C9CA6;--dim:#5E5E68;
--acc:#F5B73B;--accInk:#1C1404;--accs:rgba(245,183,59,.13);--accT:#F5B73B;
--fT:#4FD1A5;--fP:#74AAFF;--fD:#FF7B7B;--onF:#101012;
--ok:#4FD1A5;--oks:rgba(79,209,165,.12);--ko:#FF7B7B;--kos:rgba(255,123,123,.12);
--fret:#3C3C45;--nut:#C2C2CA;
--t0b:#3B3020;--t0f:#F5B73B;--t1b:#1D3936;--t1f:#52D3C6;--t2b:#43212A;--t2f:#F47D8D;--t3b:#45291F;--t3f:#F48B5C;--t4b:#2C2948;--t4f:#AB9FFF;--t5b:#3A2440;--t5f:#DA8BE7;--t6b:#2A2A31;--t6f:#B5B5BF;
--fd:'Manrope','Segoe UI',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,Menlo,monospace;--r:18px;--navh:66px;color-scheme:dark}
:root[data-theme="light"]{--bg:#F5F4F1;--side:#ECEAE5;--sf:#FFFFFF;--sf2:#F1EFEB;--sf3:#E4E1DA;--line:#E2DFD8;--ink:#18181B;--mut:#5E5E67;--dim:#A3A3AB;
--acc:#F2B12F;--accInk:#1C1404;--accs:rgba(242,177,47,.2);--accT:#966000;
--fT:#0B8A60;--fP:#2B6CD4;--fD:#D33A3A;--onF:#FFFFFF;--ok:#0B8A60;--oks:#E1F4EC;--ko:#D33A3A;--kos:#FBE4E4;--fret:#C8C5BE;--nut:#3A3A41;
--t0b:#F8E9C6;--t0f:#8A5800;--t1b:#D3EEEA;--t1f:#0F6F69;--t2b:#F7DADF;--t2f:#A4233A;--t3b:#F7DED2;--t3f:#A5461C;--t4b:#E2DEF8;--t4f:#4A3AB0;--t5b:#EFDAF3;--t5f:#7D2E8F;--t6b:#E9E8EC;--t6f:#55555E;color-scheme:light}
@media(prefers-color-scheme:light){:root:not([data-theme]){--bg:#F5F4F1;--side:#ECEAE5;--sf:#FFFFFF;--sf2:#F1EFEB;--sf3:#E4E1DA;--line:#E2DFD8;--ink:#18181B;--mut:#5E5E67;--dim:#A3A3AB;--acc:#F2B12F;--accInk:#1C1404;--accs:rgba(242,177,47,.2);--accT:#966000;--fT:#0B8A60;--fP:#2B6CD4;--fD:#D33A3A;--onF:#FFFFFF;--ok:#0B8A60;--oks:#E1F4EC;--ko:#D33A3A;--kos:#FBE4E4;--fret:#C8C5BE;--nut:#3A3A41;--t0b:#F8E9C6;--t0f:#8A5800;--t1b:#D3EEEA;--t1f:#0F6F69;--t2b:#F7DADF;--t2f:#A4233A;--t3b:#F7DED2;--t3f:#A5461C;--t4b:#E2DEF8;--t4f:#4A3AB0;--t5b:#EFDAF3;--t5f:#7D2E8F;--t6b:#E9E8EC;--t6f:#55555E;color-scheme:light}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 calc(15.5px*var(--z,1))/1.55 var(--fd);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
b{font-weight:800}
p{margin:8px 0}
.c0{--tb:var(--t0b);--tf:var(--t0f)}.c1{--tb:var(--t1b);--tf:var(--t1f)}.c2{--tb:var(--t2b);--tf:var(--t2f)}.c3{--tb:var(--t3b);--tf:var(--t3f)}.c4{--tb:var(--t4b);--tf:var(--t4f)}.c5{--tb:var(--t5b);--tf:var(--t5f)}.c6{--tb:var(--t6b);--tf:var(--t6f)}
.m{color:var(--mut)}.sm{font-size:calc(13.5px*var(--z,1))}.mono{font-family:var(--fm)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* Barra de navegación: arriba en el celular, lateral en la PC */
.side{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top,0px));background:var(--side);border-bottom:1px solid var(--line)}
.logo{flex:none;width:42px;height:42px;border-radius:12px;border:0;background:var(--acc);color:var(--accInk);display:grid;place-items:center;cursor:pointer}
.logo svg{width:22px;height:22px;stroke-width:2.4}
.nvl{flex:1;min-width:0;display:flex;gap:2px}
.ni{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--mut);font:700 10.5px var(--fd);padding:6px 2px;border-radius:12px;cursor:pointer;min-height:50px}
.ni svg{width:21px;height:21px}
.ni span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ni.on{background:var(--accs);color:var(--accT)}
.tbb{position:absolute;top:3px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--ko);color:#fff;font:800 10px/17px var(--fd);font-style:normal;text-align:center}
.main{width:100%;padding:18px 16px 70px;max-width:1040px;margin:0 auto;min-width:0}
@media(min-width:900px){
:root{--navh:0px}
body{display:grid;grid-template-columns:92px minmax(0,1fr)}
.side{height:100vh;flex-direction:column;padding:18px 10px;border-bottom:0;border-right:1px solid var(--line)}
.logo{width:46px;height:46px}
.nvl{flex-direction:column;width:100%;gap:6px;margin-top:22px;flex:1}
.ni{flex:none;padding:11px 4px;font-size:11.5px}
.ni.cfg{margin-top:auto}
.main{padding:34px 48px 90px}}

/* Encabezados */
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 18px}
.brand{font:800 calc(30px*var(--z,1))/1.05 var(--fd);letter-spacing:-.025em;margin:0}
.brand small{font:600 14px var(--fd);color:var(--mut);margin-left:8px;letter-spacing:0}
.hdr{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--sf);border:1px solid var(--line);font:700 12.5px var(--fd);color:var(--mut)}
.pill svg{width:15px;height:15px;color:var(--acc)}
.pill .dt{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.eb{display:block;font:800 11.5px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--accT)}
h1{font:800 calc(clamp(25px,3.6vw,36px)*var(--z,1))/1.12 var(--fd);letter-spacing:-.02em;margin:8px 0 10px;text-wrap:balance}
h1.q{font-size:calc(clamp(21px,2.8vw,27px)*var(--z,1));margin-top:14px}
.h2{font:800 calc(17px*var(--z,1)) var(--fd);margin:30px 0 12px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.h2 small{color:var(--mut);font-weight:600;font-size:14px}
.sub,.lead{color:var(--mut);margin:4px 0 0}
.lead{font-size:calc(17px*var(--z,1))}
.lb{display:block;font:800 11px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.hint{margin:16px 0 0}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font:800 calc(15px*var(--z,1)) var(--fd);cursor:pointer;background:var(--acc);color:var(--accInk);min-height:46px;transition:transform .08s,filter .15s}
.btn svg{width:17px;height:17px;flex:none}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn.blk{display:flex;width:100%;margin-top:12px}
.btn.gh{background:var(--sf2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 15px;min-height:40px;font-size:13.5px}
.btn.danger{color:var(--ko)}
.btn:disabled{opacity:.35;cursor:default;filter:none}
.brow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.icb{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--sf);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.icb svg{width:19px;height:19px}
.icb.acc{background:var(--acc);border-color:transparent;color:var(--accInk)}
.icb:disabled{opacity:.3;cursor:default}
.lnk{background:none;border:0;color:var(--accT);font:800 14px var(--fd);padding:10px 0;cursor:pointer;min-height:44px}
@media(max-width:899px){.hide-s{display:none}}

/* Tarjetas, fichas y filas */
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:12px}
.card.hl{background:var(--accs);border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.card>b:first-child{display:block;font-size:15.5px}
details.card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";margin-left:auto;font:700 20px var(--fm);color:var(--mut)}
details.card[open]>summary::after{content:"–"}
.av{flex:none;width:44px;height:44px;border-radius:10px;background:var(--tb,var(--sf3));color:var(--tf,var(--ink));display:grid;place-items:center;font:800 13px var(--fm);letter-spacing:-.02em}
.av svg{width:20px;height:20px}
.av.sm{width:12px;height:12px;border-radius:4px}
.av.big{width:64px;height:64px;border-radius:14px;font-size:19px}
.tiles{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.wt{flex:none;width:150px;display:flex;flex-direction:column;justify-content:flex-start;align-self:flex-start;scroll-snap-align:start;background:none;border:0;padding:0;text-align:left;color:var(--ink);cursor:pointer}
.wt .art{position:relative;height:112px;border-radius:14px;background:var(--tb);color:var(--tf);display:flex;align-items:flex-end;padding:12px 14px;font:800 36px/1 var(--fm);letter-spacing:-.03em;border:2px solid transparent;transition:transform .12s}
.wt:hover .art{transform:translateY(-2px)}
.wt.sel .art{border-color:var(--acc)}
.wt .art .now{position:absolute;top:10px;left:10px;font:800 9.5px var(--fd);letter-spacing:.1em;font-style:normal;background:var(--acc);color:var(--accInk);padding:3px 7px;border-radius:999px}
.wt .art .ck{position:absolute;top:9px;right:10px;font:800 15px var(--fd);font-style:normal}
.wt b{display:block;font:800 13.5px/1.3 var(--fd);margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wt>span:last-child{font-size:12.5px;color:var(--mut)}
.rows{margin-top:6px;display:flex;flex-direction:column;gap:2px}
.rw{display:flex;align-items:center;gap:14px;width:100%;padding:9px 10px;border-radius:14px;background:none;border:0;color:var(--ink);text-align:left;cursor:pointer;min-height:62px}
.rw:hover{background:var(--sf)}
.rw.cur{background:var(--sf);box-shadow:inset 3px 0 0 var(--acc)}
.rw .tt{flex:1;min-width:0}
.rw .tt b{display:block;font:800 calc(15px*var(--z,1))/1.3 var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .tt>span{display:block;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .tt em{font-style:normal;color:var(--accT);font-weight:800}
.rw .mt{font:700 13px var(--fm);color:var(--mut);white-space:nowrap}
.rw .mt small{font-size:9.5px;color:var(--accT);margin-left:4px;letter-spacing:.08em}
.rw .st{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.rw .st svg{width:17px;height:17px}
.rw .st.ok{color:var(--ok)}
.rw.card-like{background:var(--sf);border:1px solid var(--line);margin-top:12px;padding:12px 14px}
.now-card{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:22px;padding:16px;color:var(--ink);cursor:pointer;margin-bottom:4px}
.now-card .tt{flex:1;min-width:0}.now-card b{display:block;font:800 calc(19px*var(--z,1))/1.25 var(--fd);margin:3px 0 2px}.now-card .tt>span:last-child{color:var(--mut);font-size:13.5px}
.now-card .play{flex:none;width:54px;height:54px;border-radius:50%;background:var(--acc);color:var(--accInk);display:grid;place-items:center}
.now-card .play svg{width:22px;height:22px}
.start h2{font:800 22px var(--fd);margin:6px 0 2px}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media(min-width:760px){.minis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mini{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--ink);font:inherit}
button.mini{cursor:pointer}
.mini b{display:block;font:800 26px/1.1 var(--fm);letter-spacing:-.03em}.mini b small{font-size:13px;color:var(--mut);letter-spacing:0}
.mini .m{font-size:12.5px}
.dots{display:flex;gap:5px;margin-top:8px}.dots i{width:11px;height:11px;border-radius:50%;background:var(--sf3)}.dots i.d{background:var(--acc)}
.bar{height:8px;background:var(--sf3);border-radius:999px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;border-radius:999px;background:var(--acc)}
.bar.big{height:10px;margin:16px auto 0;max-width:420px}
.wkinfo p{margin:4px 0 10px}.wkinfo p:last-child{margin-bottom:0}.okc{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.xt{display:flex;flex-direction:column;justify-content:flex-start;align-self:start;background:none;border:0;padding:0;text-align:left;color:var(--ink);cursor:pointer}
.xt .art{height:96px;border-radius:14px;background:var(--tb);color:var(--tf);display:flex;align-items:flex-end;padding:12px 14px;font:800 30px/1 var(--fm);transition:transform .12s}
.xt:hover .art{transform:translateY(-2px)}
.xt b{display:block;font:800 13.5px/1.3 var(--fd);margin-top:8px}.xt>span:last-child{font-size:12.5px;color:var(--mut)}
.feat{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(135deg,var(--accs),transparent 70%),var(--sf);border:1px solid color-mix(in srgb,var(--acc) 35%,var(--line));border-radius:22px;padding:18px 20px;margin-top:14px}
.feat .tt{flex:1;min-width:220px}.feat h2{font:800 22px var(--fd);margin:4px 0 2px}.feat p{color:var(--mut);margin:4px 0 0}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* Sesión: barra de transporte arriba (la de abajo la tapa Netlify) */
.sbar{position:sticky;top:var(--navh);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--line);margin-top:-8px}
.sbar .ttl{flex:1;min-width:0}.ttl b{display:block;font:800 15.5px/1.25 var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp{flex:none;display:flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:4px}
.tp .icb{width:40px;height:40px;border:0;background:var(--sf2)}
.tp .icb.acc{background:var(--acc)}
.tp .sl{display:flex;flex-direction:column;align-items:center;font:800 10px var(--fd);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);min-width:64px;line-height:1.2}
.tp .sl b{font:800 13px var(--fm);color:var(--accT);letter-spacing:0}
@media(max-width:560px){.sbar>.av{display:none}.ttl span{display:none}.tp .sl{min-width:52px}}
.stepper{display:flex;gap:6px;margin:14px 0 4px}
.sp{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:6px 0;color:var(--dim);font:700 11.5px var(--fd);cursor:default;min-height:40px}
.sp i{display:block;width:100%;height:5px;border-radius:999px;background:var(--sf3)}
.sp.d{color:var(--mut);cursor:pointer}.sp.d i{background:var(--ok)}
.sp.c{color:var(--ink)}.sp.c i{background:var(--acc)}
@media(max-width:480px){.sp{font-size:0;gap:0}.sp.c{font-size:10.5px;gap:4px}}
.stp{margin-top:12px}
.navr{display:flex;gap:10px;margin-top:22px}.navr .btn{flex:1}.navr .btn.gh{flex:0 0 auto}
.snav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:34px;padding-top:14px;border-top:1px solid var(--line)}
.snav .rw{background:var(--sf);border:1px solid var(--line)}
.snav .rw.r{text-align:right}.snav .rw .tt>span{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.snav .rw .tt b{font-size:14px}

/* Lección */
.why{margin-top:14px;padding:16px 18px;border-radius:var(--r);background:var(--sf);border:1px solid var(--line)}
.why p{margin:0;font-size:calc(16px*var(--z,1))}
.key{margin-top:12px;padding:20px 22px;border-radius:22px;background:linear-gradient(135deg,var(--accs),transparent 75%),var(--sf);border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line))}
.key .lb{color:var(--accT)}
.key p{margin:0;font:700 calc(clamp(18px,2.2vw,22px)*var(--z,1))/1.45 var(--fd)}
.steps{list-style:none;padding:0;margin:0;counter-reset:n}
.steps li{position:relative;padding:14px 16px 14px 58px;margin-top:8px;background:var(--sf);border:1px solid var(--line);border-radius:16px;counter-increment:n}
.steps li::before{content:counter(n,decimal-leading-zero);position:absolute;left:14px;top:13px;font:800 15px var(--fm);color:var(--accT)}
.mesa .steps li{background:var(--sf2)}
.ex .ln,.rev .ln{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px dashed var(--line);font:600 calc(15px*var(--z,1))/1.5 var(--fm)}
.rev .ln{font-family:var(--fd)}
.ex .ln:first-child,.rev .ln:first-of-type{border-top:0;padding-top:4px}
.ln .n{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accs);color:var(--accT);font:800 13px var(--fm)}
.ln .n.ok{background:var(--oks);color:var(--ok)}.ln .n.ko{background:var(--kos);color:var(--ko)}
.err{border-left:4px solid var(--ko)}.err .lb{color:var(--ko)}.err p{margin:0}
.sum{margin-top:12px;padding:16px 20px;border-radius:var(--r);background:var(--acc);color:var(--accInk)}
.sum .lb{color:var(--accInk);opacity:.7}.sum p{margin:0;font:800 calc(17px*var(--z,1))/1.4 var(--fd)}
.bh{display:flex;align-items:center;gap:14px}
.bh .tt{flex:1;min-width:0}.bh .tt b{display:block;font:800 calc(15.5px*var(--z,1))/1.3 var(--fd)}.bh .tt>span{display:block;font-size:13.5px}
.badge{flex:none;padding:5px 11px;border-radius:999px;font:800 12.5px var(--fm);background:var(--sf2);color:var(--ink)}.badge.ok{background:var(--ok);color:var(--onF)}
.exc .bh{align-items:flex-start}
.blk .bcnt{color:var(--mut);font-size:13px}
.card.bdone{border-color:var(--ok)}.card.bdone .bcnt{color:var(--ok);font-weight:800}
.tmb{flex:none;border:0;border-radius:999px;padding:8px 13px;min-height:40px;background:var(--sf2);color:var(--ink);font:800 13.5px var(--fm);cursor:pointer}

'1.1':{n:"Tonos, semitonos y escala mayor",

m:"Pensar que entre todas las notas naturales hay un tono. E–F y B–C están pegadas: si lo olvidás, la escala sale mal.",
r:"Escala mayor = T–T–S–T–T–T–S desde la tónica.",

["I–V–vi–IV y vi–IV–I–V usan:",["Los mismos acordes","Acordes distintos"],0,"Son los mismos 4 acordes; solo cambia el orden."],
["vi–IV–I–V en D mayor:",["Bm–G–D–A","Bm–A–D–G","Em–G–D–A"],0,"6 = Bm, 4 = G, 1 = D, 5 = A."],
["Am–F–C–G que reposa en C está en:",["C mayor","A menor"],0,"La tonalidad la decide el reposo, no el primer acorde."]]},

'2.5':{n:"I–vi–IV–V y ii–V–I",
p:"Completa el catálogo de patrones básicos. Clasificar canciones por patrón es el primer paso para predecir sus cambios.",
k:"I–vi–IV–V es la progresión “de los 50”; ii–V–I es predominante → dominante → tónica en estado puro.",
e:["I–vi–IV–V en C: *C–Am–F–G*. Vuelve al I y se repite.",
"ii–V–I en C: *Dm–G–C*. El ii reemplaza al IV como predominante.",
"ii y IV comparten dos notas (Dm = D F A; F = F A C): por eso cumplen la misma función.",
"En pop-rock el ii–V–I aparece poco: alcanza con reconocerlo."],
x:{t:"ii–V–I en G mayor",s:["G A B C D E F♯","ii = Am · V = D · I = G","Resultado: Am–D–G"]},
m:"Confundir ii con IV porque los dos se alejan de casa. Escuchá el color: el ii es menor, el IV es mayor.",
r:"I–vi–IV–V = 1-6-4-5 · ii–V–I = P → D → T.",
q:[["ii–V–I en C mayor:",["Dm–G–C","Em–G–C","Dm–F–C"],0,"2 = Dm, 5 = G, 1 = C."],
["I–vi–IV–V en C mayor:",["C–Am–F–G","C–Em–F–G","C–Am–G–F"],0,"1 = C, 6 = Am, 4 = F, 5 = G."],
["¿Qué función tiene el ii?",["Tónica","Predominante","Dominante"],1,"El ii prepara la dominante igual que el IV: es predominante."],
["ii–V–I en G mayor:",["Am–D–G","Am–C–G","Bm–D–G"],0,"2 = Am, 5 = D, 1 = G."],
["¿Qué notas comparten Dm y F?",["F y A","D y F","A y C"],0,"Dm = D F A; F = F A C. Comparten F y A."]]},

'3.1':{n:"La relativa menor",
p:"Muchas canciones “tristes” usan los mismos acordes que una mayor. Conocer la relativa evita confundir la tonalidad.",
k:"Cada tonalidad mayor tiene una relativa menor con las mismas notas, 3 semitonos abajo (en su 6.º grado).",
e:["C mayor ↔ A menor · G ↔ E menor · D ↔ B menor · A ↔ F♯ menor · E ↔ C♯ menor.",
"A menor natural = A B C D E F G: la escala de C empezada en A.",
"Su receta de distancias es *T–S–T–T–S–T–T*.",
"Lo único que cambia es el centro: dónde reposa la melodía."],
x:{t:"Relativa menor de F mayor",s:["Escala de F: F G A B♭ C D → 6.º grado = D","O contando 3 semitonos abajo: F → E → E♭ → D","Relativa: D menor (1 bemol, B♭)"]},
m:"Contar 3 semitonos para arriba en vez de para abajo (desde C saldría E♭, que no es).",
r:"Relativa menor = 6.º grado de la mayor, con las mismas notas.",
q:[["La relativa menor de G mayor es:",["E menor","A menor","B menor"],0,"6.º grado de G = E."],
["A menor natural tiene:",["0 alteraciones","1 sostenido","1 bemol"],0,"Usa las mismas notas que C mayor."],
["La relativa menor de D mayor es:",["B menor","E menor","F♯ menor"],0,"6.º grado de D = B."],
["La relativa menor de A mayor es:",["F♯ menor","E menor","C♯ menor"],0,"A B C♯ D E F♯: el 6.º grado es F♯."],
["Receta de la escala menor natural:",["T–S–T–T–S–T–T","T–T–S–T–T–T–S","T–S–T–T–T–S–T"],0,"Es la receta mayor rotada desde el 6.º grado."]]},

'3.2':{n:"Los acordes de la tonalidad menor",
p:"Para sacar una canción en menor necesitás saber qué acordes esperar y cómo numerarlos.",
k:"Son los acordes de la relativa mayor, numerados desde el i.",
e:["A menor: *Am (i), Bdim (ii°), C (III), Dm (iv), Em (v), F (VI), G (VII)*.",
"Patrón de calidades en menor: *m dim M m m M M*.",
"Mayúscula para los acordes mayores (III, VI, VII); minúscula para los menores (i, iv, v).",
"E menor: Em F♯dim G Am Bm C D. D menor: Dm Edim F Gm Am B♭ C."],
x:{t:"Pasar Em–C–D–Em a grados en E menor",s:["Escala: E F♯ G A B C D","Em = i · C = VI · D = VII","Resultado: i–VI–VII–i"]},
m:"Numerar con los números de la relativa mayor (llamar “vi” a Am en A menor). En A menor, Am es el i.",
r:"Menor: i ii° III iv v VI VII → m dim M m m M M.",
q:[["El VI de A menor es:",["F","G","C"],0,"A B C D E F: el 6.º lugar es F, mayor."],
["El VII de A menor es:",["F","G","E"],1,"El 7.º lugar es G, mayor."],
["El III de E menor es:",["G","A","D"],0,"E F♯ G: el 3.º lugar es G, mayor."],
["El iv de E menor es:",["Am","A","Bm"],0,"E F♯ G A: el 4.º lugar es A, y en menor el iv es menor → Am."],
["Patrón de calidades en menor natural:",["m dim M m m M M","M m m M M m dim","m M dim m M m M"],0,"Es el patrón mayor empezado desde el 6.º grado."]]},

'3.3':{n:"Menor armónica: el V mayor",
p:"Explica por qué en canciones en menor aparece un acorde mayor que “no debería estar” (E en A menor).",
k:"Subir el 7.º grado convierte el v menor en V mayor, que tiene sensible.",
e:["En menor natural, de G a A hay un tono: no hay sensible, y el v (Em) tira poco hacia Am.",
"La *menor armónica* sube el 7.º grado: G → G♯. A B C D E F G♯.",
"El v pasa a ser V: *E–G♯–B*. G♯ está a un semitono de A y empuja a resolver.",
"Por eso muchas canciones en menor cierran con V mayor → i."],
x:{t:"El V mayor de E menor",s:["5.º grado de E menor: B","Natural: Bm (B D F♯)","Subiendo el 7.º grado (D → D♯): B (B D♯ F♯)","Cierre fuerte: B → Em"]},
m:"Pensar que la canción cambió a mayor porque aparece E en A menor. Es el V de la menor armónica.",
r:"En menor, V mayor = 7.º grado subido = resolución fuerte.",
q:[["¿Qué nota se altera en la menor armónica?",["El 3.º","El 6.º","El 7.º"],2,"Se sube el 7.º grado (G → G♯ en A menor)."],
["El V de A menor armónica es:",["Em","E","F"],1,"E–G♯–B: un acorde mayor."],
["¿Cuál resuelve con más fuerza a Am?",["Em","E"],1,"E, porque tiene G♯ (la sensible)."],
["El V mayor de E menor es:",["B","Bm","D"],0,"5.º grado de E menor = B; con D♯ es mayor."],
["¿Por qué E resuelve más fuerte a Am que Em?",["Porque tiene G♯, a un semitono de A","Porque es más grave","Porque tiene más notas"],0,"G♯ es la sensible: un semitono debajo de la tónica A."]]},

'3.4':{n:"Patrones en menor",
p:"Estos cuatro loops cubren muchísimas canciones en menor del rock y el pop.",
k:"i–VII–VI baja por pasos; i–VII–VI–V le suma la tensión del V mayor.",
e:["*i–VII–VI* en A menor: Am–G–F. El bajo baja A–G–F.",
"*i–VII–VI–V*: Am–G–F–E, la cadencia andaluza.",
"*i–iv–V*: Am–Dm–E, cierre con tensión.",
"*i–VI–III–VII*: Am–F–C–G, los mismos acordes que vi–IV–I–V en C."],
x:{t:"i–VII–VI–V en E menor",s:["E F♯ G A B C D (+ D♯ para el V)","i = Em · VII = D · VI = C · V = B","Resultado: Em–D–C–B"]},
m:"Escribir el VII como vii° (como en mayor). En menor natural el VII es mayor (G en A menor).",
r:"i–VII–VI · i–VII–VI–V · i–iv–V · i–VI–III–VII.",
q:[["i–VII–VI en A menor:",["Am–G–F","Am–F–G","Am–C–G"],0,"i = Am, VII = G, VI = F."],
["Am–G–F–E es:",["i–VII–VI–V","i–VI–VII–V","vi–IV–I–V"],0,"Am (i), G (VII), F (VI) y E mayor (V)."],
["i–VI–III–VII en E menor:",["Em–C–G–D","Em–D–G–C","Em–G–C–D"],0,"i = Em, VI = C, III = G, VII = D."],
["i–iv–V en D menor:",["Dm–Gm–A","Dm–G–A","Dm–Gm–Am"],0,"D menor: Dm Edim F Gm Am B♭ C. iv = Gm; V mayor = A."],
["En la cadencia andaluza el bajo:",["Baja por pasos","Sube por pasos","Salta"],0,"A–G–F–E: baja de a una nota."]]},

'3.5':{n:"¿Mayor o relativa menor?",
p:"Es la duda más común al sacar canciones: mismos acordes, ¿mayor o menor? Decidir bien cambia todos los grados.",
k:"La tonalidad la decide el reposo, no la lista de acordes.",
e:["Am–F–C–G puede ser vi–IV–I–V (C mayor) o i–VI–III–VII (A menor).",
"Preguntas que deciden: ¿en qué acorde termina la estrofa? ¿cuál suena a “llegué”? ¿la melodía cae en C o en A?",
"Pista extra: si aparece E mayor (V de A menor), casi seguro es A menor.",
"Anotá hipótesis y confianza antes de verificar en Mesa: arriba de los acordes muestra la tonalidad que detecta."],
x:{t:"Am–F–C–G–Am, la estrofa cierra en Am",s:["Reposo en Am → A menor","Grados: i–VI–III–VII–i"]},
m:"Elegir “mayor” por costumbre. Las dos respuestas son posibles hasta que escuchás el reposo.",
r:"Mismos acordes → manda el reposo.",
q:[["Am–F–C–G; si reposa en C, la tonalidad es:",["C mayor","A menor"],0,"Si reposa en C es C mayor: vi–IV–I–V."],
["Am–F–C–G; si reposa en Am:",["C mayor","A menor"],1,"Si reposa en Am es A menor: i–VI–III–VII."],
["¿Qué pista sirve para decidir?",["El primer acorde siempre","Dónde reposa la frase","El tempo"],1,"El reposo. El primer acorde y el tempo no deciden la tonalidad."],
["Em–C–G–D, y aparece B mayor antes de volver a Em. Probablemente es:",["G mayor","E menor"],1,"B mayor es el V de E menor (con D♯): una señal fuerte de tonalidad menor."],
["¿Qué pregunta decide entre una mayor y su relativa menor?",["¿Cuál tiene más acordes?","¿Dónde reposa la música?","¿Qué tempo tiene?"],1,"Los acordes son los mismos; lo que cambia es el centro."]]},
'4.1':{n:"El bajo como pista",
p:"Es la base de todo el método para sacar canciones: la nota más grave te dice, casi siempre, la raíz del acorde.",
k:"La nota más grave que suena suele ser la raíz del acorde: la nota que le da nombre.",
e:["Método en 4 pasos: *1) escuchá el bajo, 2) encontrá esa nota en la guitarra, 3) decidí si es mayor o menor, 4) deducí la tonalidad*.",
"Buscá el bajo en las cuerdas 6 (E) y 5 (A): ahí están las raíces de casi todos los acordes.",
"En Mesa podés silenciar Guitarra, Voz y Piano y dejar solo el Bajo: se oye mucho más claro.",
"Antes de verificar, anotá tu hipótesis. Sin hipótesis previa no sabés si aprendiste o copiaste."],
x:{t:"El bajo hace G – E – C – D",s:["Raíces: G, E, C, D","Calidades probando encima: G, Em, C, D","Reposa en G → G mayor","Grados: I–vi–IV–V"]},
m:"Buscar los acordes siguiendo la melodía de la voz. La voz se mueve mucho; el bajo marca el acorde.",
r:"Bajo → raíz → mayor o menor → tonalidad.",
q:[["En la cuerda 6, el traste 3 es:",["A","G","F"],1,"E(0) F(1) F♯(2) G(3)."],
["En la cuerda 5, el traste 2 es:",["B","C","A♯"],0,"A(0) A♯(1) B(2)."],
["¿Qué buscás primero al sacar un acorde de oído?",["La melodía","El ritmo","El bajo (la nota más grave)"],2,"El bajo da la raíz; es la pista más estable."],
["El bajo hace A y la tonalidad es C mayor. El acorde más probable es:",["Am","A","A7"],0,"En C mayor, el acorde sobre A es el vi: Am."],
["En Mesa, para escuchar mejor el bajo conviene:",["Silenciar las otras pistas","Subir el Master","Activar la claqueta"],0,"Con Guitarra, Voz y Piano en silencio, el bajo queda solo."]]},

'4.2':{n:"Imaginar la raíz antes de tocarla",
p:"Anticipar el sonido antes de tocarlo es lo que entrena el oído. Funciona igual aunque no cantes afinado.",
k:"Antes de tocar un acorde, imaginá cómo va a sonar su bajo; después tocalo y compará.",
e:["De C a Am el bajo baja de C a A: *3 trastes*. De C a G baja *5 trastes*.",
"De C a F puede subir 5 trastes o bajar 7: es la misma nota en otra octava.",
"No hace falta cantar: imaginá la nota o tarareala bajito, y compará con lo que tocás.",
"Contar trastes entre raíces es otra forma de “medir” el salto que escuchás."],
x:{t:"C → G bajando",s:["C (cuerda 5, traste 3) → G (cuerda 6, traste 3)","C B B♭ A A♭ G = 5 semitonos abajo","Mismo traste, una cuerda más grave: un salto que se reconoce rápido"]},
m:"Frustrarse por no cantar afinado. El ejercicio es imaginar y comparar; la voz es opcional.",
r:"Imaginá → tocá → compará.",
q:[["De C a A, bajando, hay:",["2 trastes","3 trastes","5 trastes"],1,"C → B → B♭ → A: 3 trastes."],
["De C a G, bajando, hay:",["5 trastes","7 trastes","3 trastes"],0,"C B B♭ A A♭ G: 5 trastes."],
["Para entrenar el oído sin cantar afinado, lo importante es:",["Tener buena voz","Tocar rápido","Imaginar la nota y comparar"],2,"Lo que entrena es anticipar y comparar."],
["De C a F, subiendo, hay:",["5 trastes","7 trastes","4 trastes"],0,"C C♯ D D♯ E F: 5 semitonos."],
["De G a C, subiendo, hay:",["5 trastes","7 trastes","3 trastes"],0,"G G♯ A A♯ B C: 5 semitonos."]]},

'4.3':{n:"¿Mayor o menor?",
p:"Con la raíz ya tenés la mitad del acorde; te falta el color. Es la segunda decisión del método.",
k:"Con la raíz encontrada, probá las dos versiones (por ejemplo A y Am) y elegí la que encaja.",
e:["La diferencia está en una sola nota, la 3.ª: en A es C♯; en Am es C. Un solo traste.",
"Mayor suena abierto y luminoso; menor, más oscuro.",
"Atajo: si ya sabés la tonalidad mayor, los acordes de los lugares 2, 3 y 6 son menores.",
"En Mesa podés marcar un loop A–B sobre ese acorde y probar las dos versiones encima, con calma."],
x:{t:"Raíz E en una canción en G mayor",s:["G A B C D E: E es el 6.º lugar","El vi es menor → Em","Confirmá tocando E y Em encima de la grabación"]},
m:"Decidir con un solo rasgueo. Tocá las dos versiones encima de la canción y escuchá cuál “choca”.",
r:"Raíz + 3.ª: mayor (4 trastes) o menor (3 trastes).",
q:[["La diferencia entre A y Am está en:",["La raíz","La nota del medio (C♯ o C)","La nota más aguda"],1,"Es la 3.ª: C♯ en A y C en Am."],
["En G mayor, el acorde con raíz E es:",["E","Em","Edim"],1,"Es el 6.º lugar de G mayor → Em."],
["En C mayor, el acorde con raíz D es:",["Dm","D","D7"],0,"Es el 2.º lugar de C mayor → Dm."],
["En D mayor, el acorde con raíz F♯ es:",["F♯m","F♯","F♯dim"],0,"D E F♯: 3.er lugar → iii, menor."],
["La 3.ª de un acorde mayor está a:",["4 trastes de la raíz","3 trastes","7 trastes"],0,"Mayor = 3.ª mayor (4 semitonos); menor = 3 semitonos."]]},

'4.4':{n:"Reconstruir de oído",
p:"Separa la memoria del oído: al día siguiente ya no recordás qué dedos pusiste, solo escuchás.",
k:"Grabá 4 acordes hoy y reconstruilos mañana sin mirar.",
e:["Usá acordes de una sola tonalidad (por ejemplo C, Am, F, G). Si sabés la tonalidad, solo hay unos 6 candidatos.",
"Al reconstruir aplicá el método: bajo, raíz, mayor o menor.",
"Anotá cuántos acertaste: es tu primer dato de progreso de oído."],
x:{t:"Grabación en C mayor, el bajo hace A – F – C – G",s:["Candidatos de C mayor: C Dm Em F G Am","A → Am · F → F · C → C · G → G","Resultado: Am–F–C–G"]},
m:"Grabar una progresión que ya conocés de una canción: el oído la reconoce de memoria y el ejercicio pierde valor.",
r:"Tonalidad conocida = pocos candidatos.",
q:[["¿Por qué conviene reconstruir al día siguiente?",["Para recordar los dedos","Para reconocer de oído, sin memoria del momento","Para practicar ritmo"],1,"Así escuchás de verdad, sin recordar qué tocaste."],
["En C mayor, los acordes más comunes son:",["C, D, E, F, G, A","C, Dm, Em, F, G, Am","C, F, G solamente"],1,"I ii iii IV V vi de C mayor."],
["Orden del método:",["Bajo → raíz → mayor o menor","Mayor o menor → bajo → raíz","Tonalidad → bajo → ritmo"],0,"Primero el bajo, después la raíz, después el color."],
["¿Cuántos acordes de uso común tiene una tonalidad mayor?",["6 (sin el disminuido)","3","12"],0,"I ii iii IV V vi; el vii° casi no aparece."],
["Grabación en G mayor con el bajo en E. El acorde es:",["Em","E","E7"],0,"El vi de G mayor es Em."]]},

'4.5':{n:"Cuando el bajo no es la raíz: inversiones",
p:"Cuando el bajo “no encaja”, muchas veces es una inversión. Saberlo evita sacar acordes raros que no existen.",
k:"A veces el bajo no es la raíz: C/E es un C con E en el bajo; la barra indica qué nota suena abajo.",
e:["Las notas son las de C (C, E, G); solo cambia cuál suena más grave.",
"Suena más liviano o en movimiento; se usa para que el bajo camine por pasos.",
"Si el bajo no encaja como raíz, probá si es la 3.ª o la 5.ª de algún acorde de la tonalidad.",
"Escuchá la pista de Bajo sola en Mesa y compará con lo que suena arriba."],
x:{t:"El bajo es E, pero el acorde suena a C",s:["Notas de C: C E G → E es la 3.ª","Arriba siguen sonando C y G","Acorde: C/E (primera inversión)"]},
m:"Llamar Em a un C/E porque el bajo es E. Escuchá si arriba suenan C y G (C/E) o B (Em = E G B).",
r:"La barra dice qué nota va en el bajo.",
q:[["En C/E, la nota más grave es:",["C","G","E"],2,"La barra indica el bajo: E."],
["C/G tiene las mismas notas que:",["C","G","Em"],0,"C/G = C E G con G abajo."],
["El bajo suena E pero el acorde parece C. Probablemente es:",["Em","C/E","E"],1,"E es la 3.ª de C → C/E."],
["En G/B, la nota B es:",["La 3.ª de G","La raíz","La 5.ª"],0,"G B D: B es la 3.ª."],
["D/F♯ es:",["D con F♯ en el bajo","F♯ menor","D menor"],0,"La barra indica el bajo; F♯ es la 3.ª de D."]]},

'5.1':{n:"El color de cada grado",
p:"Reconocer el grado por su sensación te deja sacar progresiones sin buscar nota por nota.",
k:"Cada grado tiene un “color” respecto de casa.",
e:["*IV*: alejarse con calma. *V*: tensión que pide volver. *vi*: casa, pero triste.",
"*ii y iii*: menores y más suaves; el ii suele ir al V.",
"Ejercicio: tocá el I, después otro acorde, y decí el grado antes de mirar.",
"En pop-rock el primer cambio suele ir al IV o al V: empezá distinguiendo esos dos."],
x:{t:"Distinguir IV de V",s:["Después del I, ¿el acorde flota tranquilo? → IV","¿Queda tenso, pidiendo volver? → V","En C: F (IV) se siente abierto; G (V) empuja hacia C"]},
m:"Querer reconocer los 6 grados a la vez. Primero IV contra V; después sumá el vi.",
r:"IV = calma · V = tensión · vi = casa triste.",
q:[["El acorde que crea tensión y pide volver a casa es:",["IV","V","vi"],1,"El V, por la sensible."],
["El vi suena como:",["Casa, pero más triste","Tensión fuerte","Igual al V"],0,"Comparte dos notas con el I, pero es menor."],
["Si un cambio suena a “alejarse con calma”, probablemente es el:",["V","I","IV"],2,"Es el color típico del IV."],
["Después del I suena un acorde menor que se siente “casa triste”. Es el:",["vi","ii","V"],0,"El vi comparte 2 notas con el I y es menor."],
["¿Qué conviene distinguir primero?",["IV contra V","ii contra iii","vi contra vii°"],0,"Son los cambios más frecuentes."]]},

'5.2':{n:"Llegar o quedar esperando",
p:"La sensación de llegada te dice dónde termina cada frase y cuál es la tónica, en cualquier tonalidad.",
k:"V→I es llegar; I→V es quedarse esperando.",
e:["Si una frase termina en suspenso, lo más probable es que esté en el V.",
"Si termina en calma, está en el I.",
"Entrená pausando la canción justo antes de un cambio y apostando adónde va.",
"En Mesa, armá un loop A–B en el último compás de una frase y escuchá si cierra o queda abierta."],
x:{t:"Una frase termina en D, en G mayor",s:["D es el V de G","La frase queda abierta","Lo más probable: la siguiente frase arranca o termina en G"]},
m:"Confundir “el acorde más fuerte” con el V. Fijate en la sensación de pedir resolución, no en el volumen.",
r:"Suspenso = V · calma = I.",
q:[["Una frase que termina en suspenso suele estar en el:",["I","V","vi"],1,"El suspenso es la marca del V."],
["D → G en G mayor es:",["I→V","IV→I","V→I"],2,"D es el V de G."],
["Para predecir un cambio conviene:",["Pausar antes y apostar","Mirar el cifrado","Subir el volumen"],0,"Pausar y apostar entrena la anticipación."],
["A → D en D mayor es:",["V→I","I→V","IV→I"],0,"A es el V de D."],
["Para predecir el próximo acorde conviene pensar en:",["Funciones (T, P, D)","El volumen","La letra"],0,"Después de D suele venir T; después de P suele venir D."]]},

'5.3':{n:"I–IV–V o I–V–vi–IV, de oído",
p:"Si reconocés el patrón, sabés el resto de la canción sin escuchar cada acorde.",
k:"Para distinguirlas, contá los acordes y buscá el menor.",
e:["*I–IV–V*: 3 acordes, todos mayores.",
"*I–V–vi–IV*: 4 acordes, uno menor (el vi).",
"El acorde menor se reconoce por su color más oscuro en medio de los mayores.",
"En el ejercicio “Oído: progresiones” suena primero el acorde de casa como referencia."],
x:{t:"Escuchás: casa – tensión – oscuro – calma",s:["casa = I · tensión = V · oscuro = vi · calma = IV","Resultado: I–V–vi–IV"]},
m:"No contar los acordes. Contar es el filtro más rápido.",
r:"Contá acordes y buscá el menor.",
q:[["¿Cuántos acordes tiene I–V–vi–IV?",["3","4","5"],1,"I, V, vi, IV: 4 acordes."],
["¿Cuál de estas tiene un acorde menor?",["I–IV–V","I–V–vi–IV"],1,"Solo I–V–vi–IV tiene un menor (el vi)."],
["En I–V–vi–IV el acorde menor es el:",["vi","V","IV"],0,"Minúscula = menor."],
["I–IV–V tiene acordes menores:",["Ninguno","Uno","Dos"],0,"I, IV y V son mayores en tonalidad mayor."],
["Escuchás 4 acordes y el 3.º es menor y oscuro. Lo más probable:",["I–V–vi–IV","I–IV–V","ii–V–I"],0,"El vi en 3.er lugar es la firma de I–V–vi–IV."]]},

'5.4':{n:"Oído en menor",
p:"En menor, reconocer si la música cierra con V mayor o baja suave te ayuda a predecir el final.",
k:"En menor hay dos maneras típicas de moverse: i–VII–VI baja suave; i–iv–V cierra con tensión.",
e:["El V mayor en menor (E en A menor) tiene G♯, que empuja hacia A.",
"Si una canción menor suena dramática o “española” al cerrar, buscá un V mayor.",
"i–VII–VI: el bajo baja A–G–F, sin tensión fuerte."],
x:{t:"Am → Dm → E → Am",s:["i → iv → V → i","El E (con G♯) es lo que da el cierre fuerte"]},
m:"Pensar que Em y E son intercambiables. En el cierre cambian totalmente el efecto.",
r:"Menor suave: i–VII–VI · menor tenso: i–iv–V.",
q:[["i–VII–VI en A menor es:",["Am–Dm–E","Am–G–F","Am–F–C"],1,"i = Am, VII = G, VI = F."],
["En A menor, ¿qué acorde tiene la nota G♯?",["G","Em","E"],2,"E = E G♯ B."],
["i–iv–V en E menor es:",["Em–Am–B","Em–Am–Bm","Em–D–C"],0,"iv = Am; V mayor = B."],
["Am–G–F–E suena:",["Con cierre dramático (V mayor)","Totalmente mayor"],0,"Termina en E mayor, el V con sensible."],
["En E menor, ¿qué acorde tiene D♯?",["B","Bm","D"],0,"B = B D♯ F♯: el V mayor de E menor."]]},

'5.5':{n:"El ritmo engaña",
p:"El ritmo cambia la sensación pero no la armonía. Aprender a ignorarlo te evita confusiones.",
k:"La misma progresión con otro ritmo sigue siendo la misma progresión.",
e:["Fijate en el bajo y en dónde reposa, no en el patrón rítmico.",
"Para una canción nueva: *1) tonalidad, 2) raíces por el bajo, 3) mayor o menor, 4) verificá en Mesa*.",
"Anotá tu confianza (poca, media, mucha) antes de verificar. Con el tiempo, tu confianza debería coincidir con tu acierto."],
x:{t:"C–G–Am–F en balada y en rock rápido",s:["Mismo bajo: C G A F","Mismo reposo: C","Misma progresión: I–V–vi–IV"]},
m:"Creer que una canción rápida tiene “más acordes”. Muchas veces son los mismos 4 con otro ritmo.",
r:"Ritmo ≠ armonía.",
q:[["Si cambia el ritmo pero no los acordes, la progresión:",["Cambia","Es la misma"],1,"Los grados no dependen del ritmo."],
["¿Qué hacés primero con una canción nueva?",["Verificar en Mesa","Buscar dónde reposa (la tonalidad)","Sacar el solo"],1,"La tonalidad ordena todo lo demás."],
["Anotar la confianza sirve para:",["Detectar si te sobreestimás","Tocar más rápido","Nada en especial"],0,"Comparás confianza con acierto."],
["Dos canciones con C–G–Am–F a distinto tempo:",["Tienen la misma progresión","Tienen progresiones distintas"],0,"El tempo no cambia los grados."],
["Después de escribir tu hipótesis, el siguiente paso es:",["Verificar en Mesa","Borrarla","Cambiar de canción"],0,"Hipótesis → verificación → contar aciertos."]]},

'6.1':{n:"Transportar y el círculo de quintas",
p:"Transportar te deja tocar en el tono que te queda cómodo, o en el que usa otro músico del ensayo.",
k:"Transportar es mover una canción a otra tonalidad sin cambiar sus grados.",
e:["I–V–vi–IV en C es C–G–Am–F; en G es G–D–Em–C.",
"El *círculo de quintas* ordena las tonalidades: C (sin sostenidos), G (1), D (2), A (3), E (4). Cada paso suma un sostenido.",
"Truco: el V de una tonalidad es su vecina de la derecha en el círculo; el IV, su vecina de la izquierda.",
"En Explorar → Círculo de quintas podés tocar cada tonalidad y ver sus acordes."],
x:{t:"I–IV–V de A",s:["Vecinas de A en el círculo: D (izquierda) y E (derecha)","I–IV–V = A–D–E"]},
m:"Transportar subiendo “un traste a cada acorde” sin pensar en la distancia total.",
r:"Transportar = mismos grados, otra tonalidad.",
q:[["I–V–vi–IV en G mayor es:",["G–C–Em–D","G–D–Em–C","G–D–Am–C"],1,"1 = G, 5 = D, 6 = Em, 4 = C."],
["La tonalidad mayor con 2 sostenidos es:",["G","A","D"],2,"D mayor: F♯ y C♯."],
["El IV de D mayor es:",["G","A","C"],0,"La vecina de la izquierda de D en el círculo es G."],
["La vecina de la derecha de G en el círculo es:",["D","C","A"],0,"Un paso a la derecha = una quinta arriba: G → D."],
["I–IV–V en E mayor:",["E–A–B","E–A–C♯m","E–B–A"],0,"1 = E, 4 = A, 5 = B."]]},

'6.2':{n:"Pensar en números",
p:"Si pensás en grados no memorizás cada canción en cada tono: la calculás.",
k:"Pensá en números, no en nombres de acordes.",
e:["I–V–vi–IV en A (A–E–F♯m–D) es lo mismo que en C, más agudo.",
"Para pasar de números a acordes: escribí los acordes de la tonalidad y tomá los lugares.",
"E mayor: E, F♯m, G♯m, A, B, C♯m. Entonces I–V–vi–IV = E–B–C♯m–A.",
"Practicá sin papel: elegí una tonalidad al azar y decí los acordes antes de tocarlos."],
x:{t:"I–vi–ii–V en D mayor",s:["D Em F♯m G A Bm","1 = D · 6 = Bm · 2 = Em · 5 = A","Resultado: D–Bm–Em–A"]},
m:"Olvidar la calidad: en E mayor el vi es C♯m, no C♯.",
r:"Grado → lugar en la escala → acorde con su calidad.",
q:[["I–V–vi–IV en A mayor:",["A–E–F♯m–D","A–D–F♯m–E","A–E–Bm–D"],0,"1 = A, 5 = E, 6 = F♯m, 4 = D."],
["I–V–vi–IV en E mayor:",["E–A–C♯m–B","E–B–G♯m–A","E–B–C♯m–A"],2,"1 = E, 5 = B, 6 = C♯m, 4 = A."],
["El vi de D mayor es:",["Em","Bm","F♯m"],1,"D E F♯ G A B: 6.º = B, menor."],
["El ii de A mayor es:",["Bm","B","C♯m"],0,"A B: el 2.º lugar es menor → Bm."],
["I–vi–IV–V en E mayor:",["E–C♯m–A–B","E–C♯m–B–A","E–G♯m–A–B"],0,"1 = E, 6 = C♯m, 4 = A, 5 = B."]]},

'6.3':{n:"Formas móviles con cejilla",
p:"Con dos formas con cejilla tocás cualquier acorde mayor o menor en cualquier lugar del mástil.",
k:"Una forma con cejilla sirve para muchos acordes: solo la movés.",
e:["*Forma tipo E*: raíz en la cuerda 6. F en el traste 1, G en el 3, A en el 5.",
"*Forma tipo A*: raíz en la cuerda 5. B♭ en el traste 1, B en el 2, C en el 3.",
"Los menores se arman igual con la forma tipo Em (raíz en la cuerda 6) o tipo Am (raíz en la cuerda 5).",
"Ubicás la raíz con lo de la semana 1 y ponés la forma ahí."],
x:{t:"Tocar C♯m",s:["C♯ en la cuerda 5 = traste 4","Forma tipo Am con cejilla en el traste 4"]},
m:"Usar la forma tipo E pensando la raíz en la cuerda 5 (o al revés). Cada forma tiene su cuerda de raíz.",
r:"Tipo E → raíz en cuerda 6 · tipo A → raíz en cuerda 5.",
q:[["Forma tipo E con cejilla en el traste 5 da:",["G","A","C"],1,"A está en la cuerda 6, traste 5."],
["Forma tipo A con cejilla en el traste 2 da:",["B","C","D"],0,"B está en la cuerda 5, traste 2."],
["Gm con forma tipo Em lleva la cejilla en el traste:",["1","5","3"],2,"G está en la cuerda 6, traste 3."],
["D con forma tipo A va con cejilla en el traste:",["5","3","7"],0,"D está en la cuerda 5, traste 5."],
["F♯m con forma tipo Em, cejilla en el traste:",["2","4","6"],0,"F♯ está en la cuerda 6, traste 2."]]},

'6.4':{n:"El capotraste",
p:"El capo te deja usar las formas abiertas que ya sabés en cualquier tono.",
k:"El capotraste transporta sin cambiar las formas.",
e:["Cada traste de capo sube un semitono todo lo que tocás.",
"Con capo en el 2, las formas de C (C, G, Am, F) suenan en D (D, A, Bm, G).",
"Para pasar de C a E (4 semitonos), capo en el 4.",
"Si una versión suena más aguda que tus formas, contá cuántos semitonos y poné el capo ahí."],
x:{t:"La canción está en A y querés usar formas de G",s:["G → A = 2 semitonos","Capo en el 2 con formas de G (G, C, D, Em)"]},
m:"Pensar en el nombre de la forma en vez del sonido real. Con capo en el 2, la forma de G suena A.",
r:"Sonido real = forma + trastes de capo.",
q:[["Las formas de C con capo en el 2 suenan en:",["E","D","C♯"],1,"C + 2 semitonos = D."],
["Las formas de G con capo en el 2 suenan en:",["A","B","G♯"],0,"G + 2 semitonos = A."],
["Para pasar de C a E con capo, va en el traste:",["2","3","4"],2,"C C♯ D D♯ E: 4 semitonos."],
["Las formas de A con capo en el 2 suenan en:",["B","A♯","C♯"],0,"A + 2 semitonos = B."],
["Querés sonar en F usando formas de E. Capo en el traste:",["1","2","3"],0,"E → F = 1 semitono."]]},

'6.5':{n:"Transportar en menor",
p:"Las canciones en menor también se mueven de tono; los grados menores funcionan igual.",
k:"En menor se transporta igual, con los números de menor.",
e:["i–VII–VI en A menor (Am–G–F) es en E menor Em–D–C.",
"Las relativas acompañan al círculo: C/A menor, G/E menor, D/B menor, A/F♯ menor, E/C♯ menor.",
"Para transportar en menor, escribí los 7 acordes de la menor nueva y tomá los lugares.",
"Elegí el tono más cómodo: A menor y E menor tienen muchos acordes abiertos."],
x:{t:"i–VII–VI de A menor a E menor",s:["E menor: Em F♯° G Am Bm C D","i = Em · VII = D · VI = C","Resultado: Em–D–C"]},
m:"Transportar la menor como si fuera su relativa mayor y mezclar los números.",
r:"En menor también: grados → nueva escala → acordes.",
q:[["i–VII–VI en E menor:",["Em–C–D","Em–D–C","Em–D–Am"],1,"i = Em, VII = D, VI = C."],
["i–VII–VI en D menor:",["Dm–C–B♭","Dm–C–A","Dm–B♭–C"],0,"D menor: Dm Edim F Gm Am B♭ C. VII = C, VI = B♭."],
["La relativa menor de D mayor es:",["E menor","F♯ menor","B menor"],2,"El 6.º grado de D es B."],
["i–iv–v en E menor (menor natural):",["Em–Am–Bm","Em–A–Bm","Em–Am–B"],0,"Menor natural: iv = Am, v = Bm (con V mayor sería B)."],
["La relativa menor de E mayor es:",["C♯ menor","B menor","G♯ menor"],0,"E F♯ G♯ A B C♯: el 6.º grado es C♯."]]},
'7.1':{n:"Acordes con séptima",
p:"Las séptimas aparecen en blues, rock y baladas. Reconocerlas de oído evita confundirlas con tríadas.",
k:"Un acorde con séptima tiene 4 notas: la tríada más una.",
e:["*maj7* (Cmaj7 = C E G B): suave, soñador.",
"*7* (C7 = C E G B♭): tenso; es la séptima “de dominante”.",
"*m7* (Am7 = A C E G): suave y oscuro.",
"G7 = G B D F. Ese F, junto al B, crea la tensión que resuelve en C."],
x:{t:"Armar D7",s:["Tríada D: D F♯ A","7.ª menor: un tono debajo de la octava (D) → C","D7 = D F♯ A C"]},
m:"Confundir maj7 con 7. La 7.ª de C7 es B♭ (tensa); la de Cmaj7 es B (suave).",
r:"maj7 = suave · 7 = tensa · m7 = menor suave.",
q:[["¿Cuántas notas tiene un acorde con séptima?",["3","4","5"],1,"Tríada (3 notas) + la 7.ª."],
["La séptima que aparece sobre el V es:",["maj7","m7","7 (de dominante)"],2,"V7 es el acorde con más tensión de la tonalidad."],
["G7 le agrega a G la nota:",["F","F♯","A"],0,"G B D + F (7.ª menor)."],
["Las notas de Am7 son:",["A C E G","A C♯ E G","A C E G♯"],0,"Am (A C E) + G."],
["¿Cuál suena más tenso?",["C7","Cmaj7","Am7"],0,"La 7.ª menor sobre un acorde mayor (séptima de dominante) crea tensión."]]},

'7.2':{n:"V7 → I",
p:"El V7 es la señal más clara de que el próximo acorde es el I.",
k:"V7 → I es la resolución más fuerte.",
e:["G7 → C, D7 → G, A7 → D, E7 → A.",
"Cuando escuches un acorde con ese “picante” de tensión, apostá a que el siguiente es el I.",
"Para entrenar el oído usá el ejercicio “Tríada o séptima” en Practicar."],
x:{t:"B7 en una canción en E mayor",s:["E F♯ G♯ A B: B es el V","B7 → E: resolución fuerte"]},
m:"Pensar que la séptima cambia el grado. G7 sigue siendo el V de C.",
r:"V7 → I.",
q:[["D7 resuelve naturalmente en:",["A","G","C"],1,"D es el V de G."],
["E7 resuelve en:",["A","B","D"],0,"E es el V de A."],
["G7 es el V7 de:",["D mayor","G mayor","C mayor"],2,"G es el V de C."],
["A7 resuelve en:",["D","E","A"],0,"A es el V de D."],
["B7 es el V7 de:",["E mayor","B mayor","A mayor"],0,"E F♯ G♯ A B: B es el 5.º grado."]]},

'7.3':{n:"Inversiones",
p:"Muchos acompañamientos usan inversiones para que el bajo suene como una melodía.",
k:"Una inversión es el mismo acorde con otra de sus notas en el bajo.",
e:["C (bajo C) · *C/E* (bajo E, 1.ª inversión) · *C/G* (bajo G, 2.ª inversión).",
"Se usan para que el bajo avance por pasos cortos en vez de saltar.",
"Al sacar de oído: si el bajo no coincide con la raíz que esperabas, probá una inversión."],
x:{t:"C → C/E → F",s:["Bajo: C → E → F (sube por pasos)","Sin la inversión, el bajo haría C → C → F"]},
m:"Escribir la inversión como otro acorde (C/G como G). Arriba siguen sonando C, E y G.",
r:"Inversión = mismo acorde, otro bajo.",
q:[["C/G tiene en el bajo:",["C","E","G"],2,"La barra indica el bajo: G."],
["G/B es:",["G con B en el bajo","B menor","G menor"],0,"B es la 3.ª de G."],
["Las inversiones sirven para que el bajo:",["Salte más","Avance por pasos cortos","Desaparezca"],1,"Así el bajo se mueve como una melodía."],
["C/E es la inversión con:",["La 3.ª en el bajo","La 5.ª en el bajo","La raíz en el bajo"],0,"E es la 3.ª de C."],
["D/A tiene en el bajo:",["A, la 5.ª de D","A, la raíz","F♯"],0,"D F♯ A: A es la 5.ª."]]},

'7.4':{n:"Tríadas en las cuerdas agudas",
p:"Acompañar con tríadas agudas deja espacio al bajo y a otra guitarra: muy útil en los ensayos con banda.",
k:"Una tríada en las cuerdas 3, 2 y 1 es un acorde chico y agudo.",
e:["*C* en las cuerdas 3-2-1: trastes 0-1-0 (G C E), 5-5-3 (C E G) y 9-8-8 (E G C).",
"*F*: trastes 2-1-1 (A C F), 5-6-5 (C F A) y 10-10-8 (F A C).",
"Pasar de un acorde a la posición más cercana del siguiente, sin saltar, suena más fluido."],
x:{t:"C → F sin saltar",s:["C en 0-1-0 (G C E)","F en 2-1-1 (A C F)","El C de la cuerda 2 queda igual; las otras dos notas se mueven poco"]},
m:"Saltar siempre a la misma posición. Buscá la más cercana al acorde anterior.",
r:"Tríada = 3 notas; elegí la posición más cercana.",
q:[["¿Cuántas notas tiene una tríada?",["2","3","4"],1,"Raíz, 3.ª y 5.ª."],
["Cuerdas 3-2-1 en los trastes 5-5-3 dan el acorde:",["G","F","C"],2,"C E G."],
["Las tríadas agudas sirven para:",["Acompañar sin tapar a otros","Hacer el bajo","Afinar"],0,"Ocupan solo el registro agudo."],
["Cuerdas 3-2-1 en los trastes 2-1-1 dan:",["F","G","Dm"],0,"A C F = F."],
["Al pasar de C a F con tríadas conviene:",["La posición más cercana","Siempre la misma posición","Saltar una octava"],0,"Menos movimiento de la mano, más fluidez."]]},

'7.5':{n:"Bajo que camina",
p:"Es un recurso muy común en baladas y rock: si lo reconocés, ya sabés que hay inversiones.",
k:"En C–G/B–Am–F el bajo baja C, B, A, F: los acordes casi no cambian, pero el bajo camina.",
e:["G/B es G con B en el bajo. Gracias a ese B, el paso de C a A se hace nota por nota.",
"Variante frecuente: C–G/B–Am–Am/G–F (bajo C, B, A, G, F).",
"Si escuchás un bajo que baja nota a nota, sospechá inversiones."],
x:{t:"La misma idea en G mayor",s:["G – D/F♯ – Em – C","Bajo: G → F♯ → E → C","D/F♯ = D con su 3.ª en el bajo"]},
m:"Escribir G/B como Bm o Bdim. Arriba suenan G, B y D.",
r:"Bajo que camina por pasos = inversiones.",
q:[["En C–G/B–Am, el bajo hace:",["C–G–A","C–B–A","C–D–E"],1,"La barra pone B en el bajo."],
["En C mayor, G/B es:",["El V (G) con B en el bajo","El vii° (B disminuido)","El iii (E menor)"],0,"Es el V con su 3.ª en el bajo."],
["Un bajo que baja nota a nota sugiere:",["Acordes con séptima","Cambio de tonalidad","Inversiones"],2,"Las inversiones permiten esos pasos."],
["En G – D/F♯ – Em, el bajo hace:",["G – F♯ – E","G – D – E","G – A – B"],0,"La barra pone F♯ en el bajo."],
["Am/G tiene en el bajo:",["G","A","E"],0,"La barra indica G (la 7.ª de Am)."]]},

'7.7':{n:"Sus, add9 y power chords",
p:"Muchos rocks y baladas usan acordes sin 3.ª. Si la pregunta “¿mayor o menor?” no tiene una respuesta clara, probablemente es uno de estos.",
k:"Algunos acordes no son ni mayores ni menores: no tienen 3.ª, o la reemplazan por otra nota.",
e:["*sus4*: la 3.ª se reemplaza por la 4.ª. Dsus4 = D, G, A. Suena suspendido y casi siempre resuelve al mayor: Dsus4 → D.",
"*sus2*: la 3.ª se reemplaza por la 2.ª. Dsus2 = D, E, A. Suena abierto y ambiguo; pide resolver mucho menos.",
"*add9*: la tríada completa más la 9.ª (la 2.ª, una octava arriba), sin quitar la 3.ª. Cadd9 = C, E, G y D. Sigue siendo mayor, con más brillo.",
"*Power chord (5)*: solo raíz y 5.ª. E5 = E y B. Sin 3.ª no es mayor ni menor: es la base del rock con distorsión.",
"Al sacar de oído: si dudás entre mayor y menor y ninguno encaja, probá sus2, sus4 o power chord."],
x:{t:"Dsus4 → D",s:["Dsus4 = D G A","El G baja a F♯ → D = D F♯ A","Esa bajada de un traste es la “resolución” del sus4"]},
m:"Clasificar un power chord como mayor por defecto. Sin 3.ª no se puede saber: lo decide el contexto.",
r:"sus2 = 1 2 5 · sus4 = 1 4 5 · add9 = 1 3 5 + 9 · power = 1 5.",
q:[["Las notas de Dsus4 son:",["D, G, A","D, F♯, A","D, E, A"],0,"La 4.ª (G) reemplaza a la 3.ª (F♯)."],
["¿Qué le falta a un power chord para ser mayor o menor?",["La 5.ª","La 3.ª","La raíz"],1,"La 3.ª es la que define el color."],
["Asus4 suele resolver en:",["Am","A","E"],1,"El sus4 resuelve al acorde mayor."],
["Cadd9 tiene las notas:",["C E G D","C D G","C F G"],0,"Tríada C + D (la 9.ª)."],
["Un power chord E5 tiene:",["E y B","E, G♯ y B","E, G y B"],0,"Solo raíz y 5.ª."]]},

'8.1':{n:"Acordes ajenos: el bVII",
p:"Un acorde “fuera de lugar” no es un error: casi siempre es uno de cuatro casos típicos. El bVII es el más común en el rock.",
k:"Un acorde ajeno tiene una nota que no está en la escala, y casi siempre tiene una explicación típica.",
e:["bVII en C mayor = *B♭* (B♭ D F). El B♭ no está en C mayor: viene “prestado” de C menor.",
"Muy común en rock: C–B♭–F–C.",
"Para detectarlo: encontrá la nota que no está en la escala y fijate a qué acorde pertenece.",
"El bVII es un acorde mayor un tono abajo de la tónica: en G mayor es F; en D, C; en A, G."],
x:{t:"F en una canción en G mayor",s:["Notas de F: F A C","La escala de G tiene F♯, no F","F = bVII prestado de G menor"]},
m:"Cambiar de tonalidad por un solo acorde ajeno. Primero probá las explicaciones típicas.",
r:"bVII = acorde mayor un tono abajo de la tónica.",
q:[["¿Qué nota de B♭ no está en C mayor?",["D","B♭","F"],1,"C mayor tiene B, no B♭."],
["El bVII de G mayor es:",["F","F♯","E"],0,"Un tono abajo de G: F."],
["Un acorde ajeno:",["Es siempre un error","Suele tener una explicación típica"],1,"Suele ser bVII, iv, V/V o V/vi."],
["El bVII de D mayor es:",["C","C♯","B"],0,"Un tono abajo de D: C."],
["En C–B♭–F–C la tonalidad sigue siendo:",["C mayor","B♭ mayor","F mayor"],0,"Reposa en C; el B♭ es prestado."]]},

'8.2':{n:"El iv menor",
p:"El iv menor da ese final nostálgico de muchas baladas.",
k:"El iv menor (Fm en C) es un “IV triste”.",
e:["F tiene A; Fm tiene *A♭*, una nota que viene de C menor.",
"Suele aparecer justo después del IV: C–F–Fm–C. Da un final nostálgico.",
"Para distinguir IV de iv: es la misma raíz; cambia el color (mayor o menor)."],
x:{t:"El iv en G mayor",s:["IV = C (C E G)","iv = Cm (C E♭ G)","E♭ no está en G mayor → prestado de G menor"]},
m:"Confundir el iv con el ii. Fm en C tiene raíz F (lugar 4); Dm es el ii.",
r:"iv = el IV en menor, prestado.",
q:[["La nota ajena de Fm en C mayor es:",["F","C","A♭"],2,"Fm = F A♭ C; C mayor tiene A, no A♭."],
["El iv prestado de G mayor es:",["Cm","C","Am"],0,"IV de G = C → iv = Cm."],
["C–F–Fm–C, comparado con C–F–F–C, suena:",["Igual","Más nostálgico al final"],1,"El A♭ oscurece el cierre."],
["El iv prestado de D mayor es:",["Gm","G","Em"],0,"IV de D = G → iv = Gm."],
["La nota ajena de Gm en D mayor es:",["B♭","G","D"],0,"Gm = G B♭ D; D mayor tiene B."]]},

'8.3':{n:"V/V: el quinto del quinto",
p:"Es la forma clásica de “empujar” hacia el V.",
k:"V/V es una dominante prestada para llegar al V.",
e:["En C mayor: *D7* (D F♯ A C) → G7 → C.",
"El F♯ no está en C mayor: es la nota que empuja hacia G.",
"Pista: un acorde mayor o con séptima en el lugar 2 (D o D7 en C) casi siempre es V/V.",
"También aparece como D mayor, sin la séptima."],
x:{t:"V/V en A mayor",s:["V de A = E","V de E = B → V/V = B7","B7 → E → A"]},
m:"Llamarlo “ii mayor” y no ver hacia dónde va. Mirá qué viene después: casi siempre el V.",
r:"V/V = dominante del V, en el lugar 2.",
q:[["V/V en C mayor es:",["Dm","D7","G7"],1,"V de C = G; V de G = D → D7."],
["V/V en G mayor es:",["A7","Am","D7"],0,"V de G = D; V de D = A → A7."],
["La nota ajena de D7 en C mayor es:",["D","A","F♯"],2,"D7 = D F♯ A C; C mayor tiene F."],
["V/V en D mayor es:",["E7","Em","A7"],0,"V de D = A; V de A = E → E7."],
["Después de un V/V casi siempre viene:",["El V","El vi","El IV"],0,"Para eso existe: preparar el V."]]},

'8.4':{n:"V/vi: hacia el acorde menor",
p:"Explica el “mayor raro” en el 3.er lugar: lleva al vi con fuerza.",
k:"V/vi lleva al vi.",
e:["En C mayor: *E7* (E G♯ B D) → Am.",
"El G♯ no está en C mayor y empuja hacia A. Es el mismo V mayor que viste en A menor.",
"Pista: un acorde mayor en el lugar 3 (E en C) suele ser V/vi."],
x:{t:"V/vi en D mayor",s:["vi de D = Bm","V de B = F♯ → V/vi = F♯7","F♯7 → Bm"]},
m:"Pensar que la canción pasó a A menor. Es un empujón momentáneo hacia el vi.",
r:"V/vi = mayor en el lugar 3 que va al vi.",
q:[["V/vi en C mayor es:",["Em","E7","A7"],1,"vi de C = Am; su V = E → E7."],
["La nota ajena de E7 en C mayor es:",["G♯","E","D"],0,"E7 = E G♯ B D; C mayor tiene G."],
["V/vi en G mayor es:",["Bm","E7","B7"],2,"vi de G = Em; su V = B → B7."],
["V/vi en D mayor es:",["F♯7","F♯m","B7"],0,"vi de D = Bm; su V = F♯ → F♯7."],
["Un acorde mayor en el lugar 3 de una tonalidad mayor suele ser:",["V/vi","bVII","iv"],0,"Lleva al vi."]]},

'8.5':{n:"Método ante un acorde raro",
p:"Une todo lo de la semana en un procedimiento que podés aplicar a cualquier canción.",
k:"Ante un acorde raro: 1) nombrá sus notas, 2) encontrá la que no está en la escala, 3) probá explicaciones.",
e:["Las cuatro explicaciones más comunes: *bVII prestado, iv prestado, V/V y V/vi*.",
"Mirá también qué acorde viene después: confirma o descarta la explicación.",
"Anotá tu explicación y tu confianza. Si ninguna encaja, puede ser un cambio de tonalidad."],
x:{t:"A mayor en una canción en G",s:["A = A C♯ E → C♯ no está en G mayor","A está en el lugar 2 → candidato: V/V","Confirmación: ¿después viene D (el V)?"]},
m:"Quedarse con la primera explicación sin chequear qué acorde viene después.",
r:"Notas → la ajena → 4 explicaciones → confianza.",
q:[["Un D mayor en una canción en C probablemente es:",["bVII","V/V","iv"],1,"D está en el lugar 2 de C: V/V."],
["Un B♭ en una canción en C probablemente es:",["bVII prestado","V/vi","V/V"],0,"Un tono abajo de la tónica: bVII."],
["Si ninguna explicación encaja, puede ser:",["Un error seguro","Un cambio de tonalidad"],1,"Las canciones a veces modulan."],
["B mayor en una canción en G, seguido de Em:",["V/vi","V/V","bVII"],0,"Em es el vi de G y B es su V."],
["Fm en una canción en C, justo después de F:",["iv prestado","V/V","bVII"],0,"Misma raíz que el IV, en menor."]]},

'9.1':{n:"La pentatónica menor",
p:"Es la escala más usada para improvisar en rock y blues, y la más fácil de ubicar en el mástil.",
k:"La pentatónica menor tiene 5 notas: es la escala menor sin la 2.ª ni la 6.ª.",
e:["A menor pentatónica: *A, C, D, E, G*.",
"Posición 1, desde el traste 5: cuerda 6 trastes 5 y 8; cuerdas 5, 4 y 3 trastes 5 y 7; cuerdas 2 y 1 trastes 5 y 8.",
"Los A (la nota de reposo) están en la cuerda 6 traste 5, cuerda 4 traste 7 y cuerda 1 traste 5.",
"Sin la 2.ª y la 6.ª no quedan semitonos entre sus notas: por eso casi ninguna nota choca."],
x:{t:"E menor pentatónica",s:["E menor: E F♯ G A B C D","Sin la 2.ª (F♯) ni la 6.ª (C)","Resultado: E G A B D"]},
m:"Tocar la escala sin saber dónde está la raíz. Siempre ubicá primero los A.",
r:"Pentatónica menor = 1 ♭3 4 5 ♭7.",
q:[["¿Cuántas notas tiene una pentatónica?",["5","6","7"],0,"Penta = cinco."],
["¿Qué nota NO está en A menor pentatónica?",["C","B","G"],1,"B es la 2.ª de A menor, que se quita."],
["En la posición 1 de A menor, la cuerda 6 traste 5 es:",["G","E","A"],2,"E(0)…A(5): la raíz."],
["D menor pentatónica:",["D F G A C","D E F A C","D F G A B♭"],0,"D menor sin la 2.ª (E) ni la 6.ª (B♭)."],
["¿Por qué la pentatónica choca poco con los acordes?",["No tiene semitonos","Tiene más notas","Es más grave"],0,"Sin semitonos entre sus notas, ninguna “roza” fuerte."]]},

'9.2':{n:"Frases con pausas",
p:"Lo que hace musical a un solo no es la cantidad de notas, sino el fraseo.",
k:"Una frase es como una oración: empieza, dice algo y respira.",
e:["Tocá 2 compases y dejá 2 compases de silencio.",
"Repetir una idea corta (un *motivo*) con una pequeña variación suena más musical que tocar muchas notas.",
"Usá una base Am–F–C–G grabada, o el metrónomo a 70–80 BPM."],
x:{t:"Pregunta y respuesta",s:["Compases 1-2: A C D (pregunta: termina arriba)","Compases 3-4: silencio","Compases 5-6: D C A (respuesta: vuelve a la raíz)"]},
m:"Tocar sin pausas. El silencio es parte de la frase.",
r:"Frase corta + silencio + repetir variando.",
q:[["Después de una frase de 2 compases conviene:",["Otra frase sin pausa","Una pausa","Un acorde fuerte"],1,"La pausa le da forma a la frase."],
["Un motivo es:",["Una idea corta que se repite y varía","Un acorde","Una escala completa"],0,"Es la unidad básica del fraseo."],
["Tempo sugerido para empezar:",["140 BPM","70–80 BPM","200 BPM"],1,"Lento, para pensar cada frase."],
["Terminar una “respuesta” en la raíz suena:",["Cerrado","Abierto"],0,"La raíz es reposo."],
["Variar un motivo puede ser:",["Cambiar el ritmo o la última nota","Tocar otra escala","Subir el volumen"],0,"Mismo material, pequeño cambio."]]},

'9.3':{n:"Notas guía: terminar en el acorde",
p:"Terminar las frases en notas del acorde hace que la improvisación “encaje” con la armonía.",
k:"Terminá cada frase en una nota del acorde que está sonando.",
e:["Notas de cada acorde que están en A menor pentatónica: *Am → A, C, E · F → A, C · C → C, E, G · G → G, D*.",
"Comparalo con terminar en una nota que no es del acorde: suena colgada, sin cerrar.",
"Las más expresivas son la 3.ª (define mayor o menor) y la 7.ª, si el acorde la tiene."],
x:{t:"Terminar una frase sobre F",s:["F = F A C","De la pentatónica de A menor, A y C son del acorde","Terminá en A (la 3.ª de F) → suena resuelto"]},
m:"Terminar todas las frases en A aunque cambie el acorde. Sobre G, el A no es del acorde.",
r:"Final de frase = nota del acorde que suena.",
q:[["Sobre el acorde F, una buena nota para terminar (dentro de la pentatónica) es:",["B","D","A"],2,"A es la 3.ª de F."],
["Las notas del acorde C son:",["C, E, G","C, D, E","C, F, A"],0,"Raíz, 3.ª y 5.ª."],
["Terminar en una nota que no es del acorde suena:",["Más resuelto","Colgado, sin cerrar"],1,"Queda tensión sin resolver."],
["Sobre G, buenas notas para terminar (dentro de A menor pentatónica) son:",["G y D","A y C","C y E"],0,"G = G B D; G y D están en la pentatónica."],
["La 3.ª de Am es:",["C","E","A"],0,"Am = A C E."]]},

'9.4':{n:"Pentatónica mayor",
p:"Te da un sonido más alegre (country, pop, rock clásico) con las mismas posiciones que ya conocés.",
k:"La pentatónica mayor usa las mismas notas que la pentatónica de su relativa menor.",
e:["C mayor pentatónica = *C, D, E, G, A* (las mismas que A menor pentatónica).",
"Es la escala mayor sin la 4.ª ni la 7.ª: grados 1 2 3 5 6.",
"Lo que cambia es la nota en la que se apoyan las frases: C en mayor, A en menor.",
"Sobre bases mayores y alegres suele quedar mejor la mayor; sobre bases menores o de blues-rock, la menor."],
x:{t:"G mayor pentatónica",s:["G mayor: G A B C D E F♯","Sin la 4.ª (C) ni la 7.ª (F♯)","Resultado: G A B D E (las mismas notas que E menor pentatónica)"]},
m:"Usar la posición de A menor sobre una base en A mayor creyendo que es “la pentatónica”. Sobre A mayor, la mayor es A B C♯ E F♯.",
r:"Pentatónica mayor = pentatónica de la relativa menor, con otro centro.",
q:[["C mayor pentatónica y A menor pentatónica:",["Tienen las mismas notas","No comparten notas"],0,"Son relativas."],
["G mayor pentatónica:",["G, B♭, C, D, F","G, A, B, D, E","G, A, B, C, D"],1,"G mayor sin la 4.ª ni la 7.ª."],
["Sobre una base menor suele quedar mejor:",["La pentatónica mayor","La pentatónica menor"],1,"Coincide con el color de la base."],
["A mayor pentatónica:",["A B C♯ E F♯","A C D E G","A B D E G"],0,"A mayor sin la 4.ª (D) ni la 7.ª (G♯)."],
["D mayor pentatónica tiene las mismas notas que:",["B menor pentatónica","D menor pentatónica","A menor pentatónica"],0,"La relativa menor de D es B menor."]]},

'9.5':{n:"Grabar y elegir la mejor toma",
p:"Escucharte en frío es la forma más honesta de evaluar tu fraseo.",
k:"Grabá una base de 4 acordes y tocá 3 tomas encima; escuchalas al día siguiente y elegí la mejor.",
e:["Para elegir: ¿las frases terminan en notas del acorde? ¿hay pausas? ¿se repite y varía una idea?",
"Escribí por qué elegiste esa toma: explicarlo te obliga a escuchar con atención."],
x:{t:"Puntuar cada toma (0 a 2 por criterio)",s:["Frases que terminan en nota del acorde","Pausas entre frases","Una idea que se repite y varía","La de mayor puntaje es tu toma"]},
m:"Juzgar la toma mientras tocás: así no escuchás de verdad.",
r:"Grabá, esperá un día, escuchá y elegí con criterios.",
q:[["¿Cuándo conviene escuchar las tomas?",["Mientras tocás","Al día siguiente","Nunca"],1,"Con distancia escuchás como oyente."],
["Un buen criterio para elegir la mejor toma:",["La que tiene más notas","Frases que terminan en notas del acorde"],1,"Es lo que hace que la frase encaje."],
["Explicar por qué elegiste una toma sirve para:",["Escuchar con más atención","Tocar más rápido"],0,"Te obliga a fijarte en detalles."],
["Una toma con muchas notas y sin pausas suele sonar:",["Atropellada","Más musical"],0,"El silencio da forma a las frases."],
["Al día siguiente escuchás:",["Con distancia, como oyente","Igual que mientras tocás"],0,"Sin el recuerdo de lo que querías hacer."]]},

'9.7':{n:"Blues de 12 compases",
p:"El blues de 12 compases es la base de muchísimo rock, y la forma ideal para practicar improvisación sobre cambios.",
k:"El blues de 12 compases usa tres acordes: I7, IV7 y V7.",
e:["En A son A7, D7 y E7. Los tres llevan séptima aunque la tonalidad sea mayor: ese es el color del blues.",
"Esquema estándar, un acorde por compás: *I7 I7 I7 I7 · IV7 IV7 I7 I7 · V7 IV7 I7 V7*.",
"El último V7 (compás 12) se llama *turnaround*: prepara la vuelta al principio. Una variante común pone el IV7 en el compás 2.",
"Sobre todo el blues funciona la pentatónica menor de la tónica (en A: A, C, D, E, G), aunque los acordes sean mayores.",
"Escala de blues = pentatónica menor + la 5.ª disminuida (la *blue note*). En A: A, C, D, E♭, E, G. El E♭ se usa de paso."],
x:{t:"Blues en E",s:["I7 = E7 · IV7 = A7 · V7 = B7","E7 E7 E7 E7 · A7 A7 E7 E7 · B7 A7 E7 B7"]},
m:"Perderse en la forma. Contá los compases en voz alta las primeras veces.",
r:"I7 ×4 · IV7 ×2, I7 ×2 · V7 IV7 I7 V7.",
q:[["En un blues en E, el IV7 es:",["B7","A7","D7"],1,"E F♯ G♯ A: el 4.º grado es A."],
["En el esquema estándar, el compás 9 es:",["IV7","I7","V7"],2,"El tercer renglón empieza con V7."],
["La blue note de la escala de blues de A es:",["F♯","B♭","E♭"],2,"La 5.ª disminuida de A."],
["En un blues en A, el compás 5 es:",["D7","A7","E7"],0,"Los compases 5 y 6 son IV7."],
["El último compás (turnaround) suele ser:",["V7","I7","IV7"],0,"Prepara la vuelta al inicio."]]},
'10.1':{n:"Análisis: tonalidad y estrofa",
p:"Analizar canciones completas es donde se junta todo. Cada ficha que hacés es repertorio entendido, no solo memorizado.",
k:"Analizar una canción es armar su mapa: tonalidad, secciones y grados.",
e:["Empezá por la tonalidad (dónde reposa) y por la estrofa.",
"Escribí la estrofa en grados, no en acordes: así la comparás con los patrones que ya conocés.",
"Mesa muestra arriba la tonalidad y los grados detectados: usalo para *verificar*, no para empezar."],
x:{t:"Ficha mínima",s:["Canción: …","Tonalidad: … (confianza: media)","Estrofa: I–V–vi–IV","Verificado en Mesa: sí / no"]},
m:"Mirar primero el análisis de Mesa. Te quita el ejercicio y no entrenás nada.",
r:"Tonalidad → estrofa en grados → hipótesis → Mesa.",
q:[["¿Por dónde empezás un análisis?",["Por el solo","Por la tonalidad","Por el final"],1,"La tonalidad ordena todo lo demás."],
["Escribir en grados sirve para:",["Comparar con patrones conocidos","Tocar más rápido"],0,"Los grados no dependen del tono."],
["¿Cuándo verificás con Mesa?",["Antes de pensar","Después de escribir tu hipótesis"],1,"Si no, no medís tu oído."],
["Mesa muestra “D mayor · I – V – vi – IV”. Eso es:",["La tonalidad y los grados detectados","Los acordes exactos de cada compás","El tempo"],0,"Es la tonalidad y la lista de grados que aparecen en la canción."],
["Si tu hipótesis no coincide con Mesa:",["Revisás dónde te confundiste","La descartás sin mirar","Mesa siempre tiene razón"],0,"Mesa también puede equivocarse: compará con el oído y anotá la causa."]]},

'10.2':{n:"Estribillo, estrofa y funciones",
p:"Las funciones muestran cómo se arma la tensión de la canción, no solo qué acordes tiene.",
k:"Estrofa y estribillo suelen usar progresiones distintas.",
e:["El estribillo muchas veces arranca en el IV o en el I y tiene más energía.",
"Debajo de cada acorde marcá su función: *T* (tónica), *P* (predominante), *D* (dominante). Así ves cómo sube y baja la tensión.",
"Preguntate: ¿dónde está el momento de más tensión de la canción?"],
x:{t:"Estribillo C–F–G–C",s:["T – P – D – T","La tensión máxima está en G, justo antes de volver a C"]},
m:"Marcar todos los acordes como T porque “suenan bien”. Usá la regla: I, iii, vi = T · ii, IV = P · V, vii° = D.",
r:"Debajo de cada grado: T, P o D.",
q:[["Las tres funciones son tónica, predominante y:",["Subtónica","Dominante","Mediante"],1,"T, P y D."],
["En C mayor, F cumple la función:",["Tónica","Predominante","Dominante"],1,"F es el IV."],
["Estrofa y estribillo:",["Siempre tienen los mismos acordes","Suelen cambiar de progresión"],1,"El cambio de progresión ayuda a diferenciarlos."],
["En G mayor, D cumple la función:",["Dominante","Tónica","Predominante"],0,"D es el V de G."],
["Am en C mayor cumple la función:",["Tónica","Dominante","Predominante"],0,"El vi tiene función de tónica."]]},

'10.3':{n:"Ajenos, inversiones y la ficha completa",
p:"Lo que no encaja es lo que le da personalidad a la canción; analizarlo completa la ficha.",
k:"Completá el análisis con lo que no es de la tonalidad: acordes ajenos, inversiones y movimientos del bajo.",
e:["Buscá acordes ajenos (bVII, iv, V/V, V/vi), inversiones y movimientos del bajo.",
"Para cada uno, anotá qué nota sale de la escala y tu explicación.",
"Armá la ficha: tonalidad, secciones en grados, funciones, ajenos, confianza y verificación."],
x:{t:"Un ajeno en la ficha",s:["Acorde: B♭ en C mayor","Nota ajena: B♭","Explicación: bVII prestado (confianza: media)"]},
m:"Dejar los acordes ajenos sin explicar. Son justamente lo más interesante.",
r:"Ficha completa = tonalidad, grados, funciones, ajenos y confianza.",
q:[["Un acorde ajeno se detecta por:",["El ritmo","Una nota fuera de la escala"],1,"La nota que no pertenece es la pista."],
["¿Qué va en la ficha?",["Solo los acordes","Tonalidad, grados, funciones, ajenos y confianza"],1,"Es el mapa completo."],
["Un B♭ en una canción en C mayor se anota como:",["bVII","V/V","iv"],0,"Mayor un tono abajo de la tónica."],
["D7 en una canción en C mayor, seguido de G:",["V/V","bVII","iv"],0,"Es la dominante del V."],
["Un bajo E debajo de un acorde de C se anota:",["C/E","Em","E"],0,"Es una inversión."]]},

'10.4':{n:"Segunda canción y comparación",
p:"La segunda canción consolida el método y empezás a ver los patrones que se repiten en tu repertorio.",
k:"Repetir el método en una segunda canción lo vuelve automático.",
e:["Hacé la ficha completa de una segunda canción, de otro estilo.",
"Compará las dos fichas: ¿usan patrones parecidos? ¿cuál tiene más tensión?",
"Cuanto más rápido llegás a la tonalidad, más tiempo te queda para los detalles."],
x:{t:"Comparación de fichas",s:["Canción 1: I–V–vi–IV en G","Canción 2: I–V–vi–IV en D","Misma progresión en grados, distinto tono"]},
m:"Elegir una segunda canción del mismo estilo: aprendés menos.",
r:"Comparar fichas = descubrir patrones.",
q:[["El primer paso con cualquier canción es:",["Encontrar la tonalidad","Sacar el solo"],0,"La tonalidad ordena todo."],
["Comparar dos fichas sirve para:",["Ver qué patrones se repiten","Nada en especial"],0,"Así ves tu repertorio desde los grados."],
["Si dos canciones usan I–V–vi–IV en distintos tonos:",["Son totalmente distintas","Tienen la misma progresión en grados"],1,"El tono no cambia los grados."],
["¿Por qué elegir una segunda canción de otro estilo?",["Para ver patrones distintos","Porque es más fácil","Da igual"],0,"Más variedad, más aprendizaje."],
["Llegar rápido a la tonalidad sirve para:",["Tener más tiempo para los detalles","Saltear la verificación"],0,"Es el paso que destraba todo."]]},

'10.5':{n:"(Opcional) Modos: mixolidio y dórico",
p:"Explica de dónde salen sonidos “rockeros” como el bVII, sin cambiar de tonalidad.",
k:"Los modos son escalas mayores o menores con una nota cambiada.",
e:["*Mixolidio* = mayor con la 7.ª bajada. En D: C en vez de C♯.",
"*Dórico* = menor con la 6.ª subida. En D menor: B en vez de B♭.",
"El mixolidio explica el bVII de muchos rocks (D–C–G en D). El dórico explica un IV mayor en una canción menor (Dm–G).",
"Probalos sobre un acorde fijo: tocá D mayor y después D mixolidio, y escuchá el cambio."],
x:{t:"D mixolidio",s:["D mayor: D E F♯ G A B C♯","Bajá la 7.ª: C♯ → C","D E F♯ G A B C = las notas de G mayor, con centro en D"]},
m:"Pensar que es otra tonalidad. El centro sigue siendo D: cambia una nota.",
r:"Mixolidio = mayor con ♭7 · dórico = menor con 6 natural.",
q:[["D mixolidio tiene:",["C♯","C natural"],1,"Se baja la 7.ª."],
["D dórico tiene:",["B natural","B♭"],0,"Se sube la 6.ª de D menor."],
["Dm–G en una canción menor sugiere:",["Mixolidio","Dórico"],1,"El IV mayor (G) sale de la 6.ª subida (B)."],
["D mixolidio tiene las mismas notas que:",["G mayor","D mayor","A mayor"],0,"D E F♯ G A B C = G mayor empezada en D."],
["A dórico tiene las mismas notas que:",["G mayor","C mayor","D mayor"],0,"A menor con F♯: A B C D E F♯ G = G mayor."]]},

const PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
/* Acordes: tríadas, séptimas (7, maj7, m7) y bajo con barra (C/E). */
const NPC=n=>(PC[n[0]]+(n[1]=='#'?1:n[1]=='b'?-1:0)+12)%12;
function parse(ch){ch=String(ch).replace(/\|.*/,'');const m=ch.match(/^([A-G][#b]?)(maj7|m7|dim|sus2|sus4|add9|m|7|5)?(?:\/([A-G][#b]?))?$/);if(!m)return null;return{pc:NPC(m[1]),q:m[2]||'M',r:m[1],bs:m[3]||null,b:m[3]?NPC(m[3]):null}}
const QI={M:[0,4,7],m:[0,3,7],dim:[0,3,6],'7':[0,4,7,10],maj7:[0,4,7,11],m7:[0,3,7,10],sus2:[0,2,7],sus4:[0,5,7],add9:[0,4,7,14],'5':[0,7]};
const QSUF={M:'',m:'m',dim:'°','7':'7',maj7:'7M',m7:'m7',sus2:'sus2',sus4:'sus4',add9:'add9','5':'5'},QLONG={M:'mayor',m:'menor',dim:'disminuido','7':'con séptima',maj7:'con séptima mayor',m7:'menor con séptima',sus2:'sus2 (sin 3.ª, con 2.ª)',sus4:'sus4 (sin 3.ª, con 4.ª)',add9:'mayor con 9.ª agregada','5':'power chord (raíz y 5.ª)'};
const nES1=n=>n[0]+(n[1]=='#'?'♯':n[1]=='b'?'♭':'');
const QWORD={M:'mayor',m:'menor',dim:'dism.','7':'séptima',maj7:'7 mayor',m7:'menor 7',sus2:'sus2',sus4:'sus4',add9:'add9','5':'power'};
const esShort=ch=>{if(ch[0]=='~')return nES1(ch.slice(1).replace('+',''));const p=parse(ch);return p?QWORD[p.q]+(p.bs?' · bajo '+nES1(p.bs):'')+(ch.includes('|')?' · forma '+ch.split('|')[1]:''):ch};
const chordES=ch=>{const p=parse(ch);return p?nES1(p.r)+' '+QLONG[p.q]+(p.bs?', con '+nES1(p.bs)+' en el bajo':''):ch};
const mf=m=>440*Math.pow(2,(m-69)/12);
let AC;const ac=()=>{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();try{const b=AC.createBuffer(1,1,22050),x=AC.createBufferSource();x.buffer=b;x.connect(AC.destination);x.start(0)}catch(e){}}if(AC.state=='suspended')AC.resume();return AC};
function pluck(f,t,d,v){if(S.cfg&&S.cfg.snd===false)return;const c=ac(),g=c.createGain(),g2=c.createGain(),o=c.createOscillator(),p=c.createOscillator();o.type='triangle';p.type='sine';o.frequency.value=f;p.frequency.value=f*2;g2.gain.value=.35;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);p.connect(g2);g2.connect(g);g.connect(c.destination);o.start(t);p.start(t);o.stop(t+d+.05);p.stop(t+d+.05)}
/* Si existe el diagrama, suena la misma forma que se ve (cuerdas 6 a 1). */
function chordNotes(ch){const f=SHP[ch];if(f){const op=[40,45,50,55,59,64];return f.map((v,i)=>v<0?-1:op[i]+v).filter(x=>x>=0)}const p=parse(ch),r=40+((p.pc-4+12)%12),iv=QI[p.q];if(p.b!=null){const b=40+((p.b-4+12)%12);return[b].concat(iv.map(x=>r+12+x))}return[r,r+(iv.includes(7)?7:6)].concat(iv.map(x=>r+12+x))}
/* '~C' = nota suelta (octava 4), '~C+' = octava arriba, '~C3' = octava indicada (C3 = raíz del C abierto). */
function playOne(ch,t,d){if(ch=='_')return;if(ch[0]=='~'){const m=ch.slice(1).match(/^([A-G][#b]?)(\d)?(\+)?$/);if(!m)return;const pc=NPC(m[1]),mid=m[2]?12*(+m[2]+1)+pc:60+pc+(m[3]?12:0);pluck(mf(mid),t,Math.min(d,m[2]?1.2:.9),m[2]?.32:.25)}else chordNotes(ch).forEach((n,i)=>pluck(mf(n),t+i*.03,d,.15))}
