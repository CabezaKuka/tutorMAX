<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guitarra 12 semanas</title>
<meta name="description" content="Programa de 12 semanas de teoría aplicada y oído para guitarra, con lecciones, ejercicios y seguimiento.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F4FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0920" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guitarra">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Concepto: escenario de estudio. Fondo violeta noche con luces de color, cada ejercicio con su color y cada función armónica (tónica verde, predominante ámbar, dominante coral) con el mismo color en toda la app. Formas variadas: píldoras, círculos, fichas y barra flotante. */
:root{--bg:#F6F4FC;--sf:#FFFFFF;--sf2:#EEEAFA;--ink:#1B1532;--mut:#625B80;--line:#E1DBF2;
--glow1:rgba(106,76,255,.16);--glow2:rgba(214,51,138,.11);
--pri:#6A4CFF;--pris:#E8E3FF;--prit:#4A2FD0;--g1:#6A4CFF;--g2:#C93A92;--sh1:#4328B8;
--fT:#0B7F53;--fP:#8F5A00;--fD:#C0303A;
--dT:#0B7F53;--dP:#9A6000;--dD:#C92F3A;
--d1:#6A4CFF;--d2:#1570D6;--d3:#D0307F;--d4:#D15300;--d5:#0A8484;
--ok:#0B7F53;--oks:#D9F3E7;--ko:#C0303A;--kos:#FCE0E2;--brass:#8F5A00;
--ac:var(--pri);--acs:var(--pris);
--fd:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;--fb:'Figtree','Segoe UI',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,Menlo,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C0920;--sf:#161230;--sf2:#211B46;--ink:#F3F0FF;--mut:#A9A3C8;--line:#2D2758;--glow1:rgba(124,92,255,.30);--glow2:rgba(214,51,138,.20);--pri:#9585FF;--pris:#2A2360;--prit:#C9BFFF;--sh1:#2E1C8A;--fT:#4FE0AB;--fP:#FFC14D;--fD:#FF8087;--ok:#4FE0AB;--oks:#12342B;--ko:#FF8087;--kos:#43202A;--brass:#FFC14D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C0920;--sf:#161230;--sf2:#211B46;--ink:#F3F0FF;--mut:#A9A3C8;--line:#2D2758;--glow1:rgba(124,92,255,.30);--glow2:rgba(214,51,138,.20);--pri:#9585FF;--pris:#2A2360;--prit:#C9BFFF;--sh1:#2E1C8A;--fT:#4FE0AB;--fP:#FFC14D;--fD:#FF8087;--ok:#4FE0AB;--oks:#12342B;--ko:#FF8087;--kos:#43202A;--brass:#FFC14D;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(520px 280px at 0% 0%,var(--glow1),transparent 70%),radial-gradient(460px 260px at 100% 8%,var(--glow2),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:500 calc(17px*var(--z,1))/1.5 var(--fb);padding-inline:16px;padding-block:16px 110px}
main{max-width:560px;margin:0 auto}
h1{font:800 27px/1.12 var(--fd);margin:14px 0 6px;text-wrap:balance;letter-spacing:-.01em}
h1.q{font-size:23px;margin-top:16px}
h2{font:700 19px/1.2 var(--fd);margin:0}
p{margin:8px 0}
b{font-weight:700}
.sub{color:var(--mut);margin:0 0 4px}
.eyebrow{display:inline-block;font:700 12px/1 var(--fb);letter-spacing:.09em;text-transform:uppercase;padding:7px 12px;border-radius:999px;color:color-mix(in srgb,var(--c,var(--pri)) 62%,var(--ink));background:var(--sf2);background:color-mix(in srgb,var(--c,var(--pri)) 15%,transparent)}
.lead{font-size:calc(20px*var(--z,1));line-height:1.55;margin:10px 0 0}
.m{color:var(--mut)}.sm{font-size:calc(14px*var(--z,1))}.mono{font-family:var(--fm)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:26px;padding:18px;margin-top:14px;box-shadow:0 8px 24px -14px rgba(40,20,120,.35)}
.card.hl{background:var(--pris);border-color:transparent}
.card.cc{border:2px solid color-mix(in srgb,var(--c) 45%,var(--line))}
.card.lessn{border-radius:30px 30px 30px 10px}
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:0;border-radius:999px;padding:16px 22px;font:700 17px var(--fb);cursor:pointer;margin-top:14px;box-shadow:0 5px 0 var(--sh1),0 12px 24px -8px rgba(106,76,255,.55);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sh1),0 4px 10px -4px rgba(106,76,255,.5)}
.btn.ghost{background:var(--pris);color:var(--prit);box-shadow:none}
.btn.ghost:active{transform:scale(.98)}
.btn.sm{width:auto;display:inline-block;padding:10px 18px;font-size:15px;margin:0;box-shadow:0 3px 0 var(--sh1)}
.btn.ghost.sm{box-shadow:none}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.lnk{background:none;border:0;color:var(--prit);font:700 15px var(--fb);padding:8px 0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--fP);outline-offset:2px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--sf);color:var(--ink);border:2px solid var(--line);border-radius:22px;padding:12px 16px 12px 12px;margin-top:11px;font:600 calc(17px*var(--z,1)) var(--fb);cursor:pointer;transition:transform .08s,border-color .15s}
.opt:active{transform:scale(.985)}
.opt .lt{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--pri)) 16%,var(--sf));color:color-mix(in srgb,var(--c,var(--pri)) 65%,var(--ink));font:700 15px var(--fm)}
.opt .ot{min-width:0;overflow-wrap:anywhere}
.opt.mono .ot{font-family:var(--fm)}
.opt.ok{background:var(--oks);border-color:var(--ok)}.opt.ok .lt{background:var(--dT);color:#fff}
.opt.ko{background:var(--kos);border-color:var(--ko)}.opt.ko .lt{background:var(--dD);color:#fff}
.fb{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:22px;margin-top:14px}.fb.g{background:var(--oks)}.fb.b{background:var(--kos)}
.fb .fi{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 16px var(--fb)}.fb.g .fi{background:var(--dT)}.fb.b .fi{background:var(--dD)}
.fb div{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{--f:var(--pri);font:700 16px var(--fm);padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--sf);color:var(--ink);cursor:pointer;transition:transform .08s}
.chip:active{transform:scale(.94)}
.chip small{font:700 11px var(--fb);opacity:.75;margin-right:4px}
.chip sup{font:700 10px var(--fb);margin-left:3px;opacity:.85}
.chip.fT{--f:var(--dT);border-color:var(--dT);background:color-mix(in srgb,var(--dT) 14%,var(--sf));color:var(--fT)}
.chip.fP{--f:var(--dP);border-color:var(--dP);background:color-mix(in srgb,var(--dP) 14%,var(--sf));color:var(--fP)}
.chip.fD{--f:var(--dD);border-color:var(--dD);background:color-mix(in srgb,var(--dD) 14%,var(--sf));color:var(--fD)}
.chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:transparent;color:#fff}
.chip.fT.on,.chip.fP.on,.chip.fD.on{background:var(--f);border-color:var(--f);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13.5px;color:var(--mut)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shape{display:flex;gap:16px;align-items:center;min-height:170px;color:var(--ink)}
.shape svg{flex:none}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;background:var(--c,var(--pri))}
.seg{display:flex;gap:5px;flex:1}.seg i{flex:1;height:9px;border-radius:999px;background:var(--line);transition:flex .2s,background .2s}
.seg i.d{background:var(--dT)}.seg i.x{background:var(--dD)}.seg i.c{background:var(--c,var(--pri));flex:2}
.seg.st i.d{background:var(--c,var(--pri))}
/* Cabecera de estudio */
.hero{position:relative;overflow:hidden;border-radius:30px 30px 30px 8px;padding:18px 18px 16px;color:#fff;background:linear-gradient(135deg,#5B3DF0 0%,#9B3FD0 55%,#E0409A 100%);box-shadow:0 14px 30px -14px rgba(106,76,255,.7)}
.hero::before{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::after{content:"";position:absolute;right:56px;bottom:-60px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero>*{position:relative;z-index:1}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:14px}
.hk{font:700 12px var(--fb);letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.ht{font:800 21px/1.15 var(--fd);margin-top:5px;text-wrap:balance}
.hr{position:relative;flex:none;width:60px;height:60px}.hr .ring{position:absolute;inset:0}.hr b{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--fm)}
.hfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.pips{display:flex;gap:5px;flex-wrap:wrap}.pips i{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.28)}.pips i.d{background:#fff}.pips i.c{background:transparent;box-shadow:0 0 0 3px #fff}
.pl{flex:none;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;padding:8px 14px;font:700 14px var(--fb);cursor:pointer}
.stp{margin-top:16px}
.task{display:flex;gap:12px;margin-top:12px}
.bl{flex:none;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--c,var(--pri)) 17%,var(--sf));color:color-mix(in srgb,var(--c,var(--pri)) 65%,var(--ink));font:700 16px/34px var(--fm);text-align:center}
.bl.A{--c:var(--d1)}.bl.B{--c:var(--d3)}
.tm{font:700 52px var(--fm);text-align:center;margin:4px 0;letter-spacing:-.02em}
.two{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:4px}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.rb{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--sf);color:var(--ink);font:700 20px var(--fm);cursor:pointer;transition:transform .1s}
.rb:active{transform:scale(.92)}
.rb.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-color:transparent;transform:scale(1.08)}
.ck{display:flex;gap:12px;align-items:center;margin-top:10px}.ck input{width:24px;height:24px;accent-color:var(--pri)}
.row{display:grid;grid-template-columns:104px 1fr 46px;gap:10px;align-items:center;margin-top:12px;font-size:15px}
.row b{text-align:right;font-family:var(--fm);font-size:14px}
.wk{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.wk i{aspect-ratio:1;display:grid;place-items:center;font:700 14px var(--fm);border-radius:50%;border:2px solid var(--line);font-style:normal}
.wk i.d{background:var(--dT);color:#fff;border-color:var(--dT)}.wk i.c{border-color:var(--pri);color:var(--prit)}
input[type=text],input[type=number],select,textarea{width:100%;font:500 17px var(--fb);padding:13px 16px;border:2px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink);margin-top:10px}
textarea{resize:vertical}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
.msg{white-space:pre-wrap;margin-top:12px;padding:14px 16px;border-radius:22px 22px 22px 6px;background:var(--sf);border:1px solid var(--line)}.msg.u{background:var(--pris);border-color:transparent;border-radius:22px 22px 6px 22px}
.st{margin:8px 0 0;padding-left:20px}.st li{margin:9px 0}
/* Barra flotante */
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);max-width:560px;margin:0 auto 6px;display:flex;gap:2px;padding:6px;background:color-mix(in srgb,var(--sf) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;box-shadow:0 10px 26px -10px rgba(30,10,100,.45);z-index:5}
.tb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:999px;color:var(--mut);font:700 12.5px var(--fb);padding:7px 0 6px;cursor:pointer;transition:background .15s,color .15s}
.tb svg{width:22px;height:22px}
.tb.on{color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2))}
/* Quiz */
.qs{margin-top:6px}
.qtop{display:flex;align-items:center;gap:12px;margin-top:6px}
.xb{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--sf2);color:var(--mut);display:grid;place-items:center;cursor:pointer}
.cmb{flex:none;display:flex;align-items:center;gap:4px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--dP);color:#fff;font:700 15px var(--fm)}
.cmb svg{width:18px;height:18px}
.qcard{margin-top:14px;padding:18px;border-radius:28px 28px 28px 8px;background:color-mix(in srgb,var(--c) 11%,var(--sf));border:2px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.qcard h1{margin:10px 0 0}
.res{text-align:center;margin-top:10px}
.rg{position:relative;width:160px;height:160px;margin:12px auto 0}.rg .ring{position:absolute;inset:0}
.rn{position:absolute;inset:0;display:grid;place-content:center}.rn b{font:800 52px/1 var(--fd)}.rn span{color:var(--mut);font-size:14px}
.res .card{text-align:left}
/* Fichas de práctica */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:150px;padding:16px;border:2px solid color-mix(in srgb,var(--c) 35%,var(--line));border-radius:28px;background:var(--sf);background:color-mix(in srgb,var(--c) 13%,var(--sf));color:var(--ink);font:600 15px var(--fb);cursor:pointer;transition:transform .1s}
.tile:nth-child(2n){border-radius:28px 28px 8px 28px}.tile:nth-child(3n){border-radius:8px 28px 28px 28px}
.tile:active{transform:scale(.97)}
.tile svg.mot{position:absolute;right:-8px;top:-8px;width:78px;height:78px;color:var(--c);opacity:.3}
.tile b{font:700 18px/1.15 var(--fd);margin-top:auto;padding-top:46px}
.tile .ac{font-size:13px;color:var(--mut)}
.tile .go{align-self:flex-start;margin-top:6px;padding:5px 12px;border-radius:999px;background:var(--c);color:#fff;font:700 13px var(--fb)}
.tile.wide{grid-column:1/-1;min-height:0}
.tile.wide b{padding-top:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;background:color-mix(in srgb,var(--c) 14%,var(--sf));border:2px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.stat b{font:800 26px/1 var(--fd)}.stat span{font-size:12px;color:var(--mut);margin-top:4px}
.row .bar i{background:var(--c,var(--pri))}
/* Diagramas */
.dg h2{font-size:18px}
.dgs{overflow-x:auto;margin:10px -6px 0;padding:0 6px}
.dgs svg{display:block;width:100%;height:auto}
.dgs.w svg{min-width:470px}
.dgs svg text{font-family:var(--fm);fill:var(--ink)}
.dgs svg .tx{fill:#fff;font-weight:700}
.dgs .nt{cursor:pointer}
.dgs .nt:active circle,.dgs .nt:active rect{opacity:.7}
.dgs .nt.on circle,.dgs .nt.on rect{fill:var(--dP)}
.kp{margin-top:10px}
.sg2{display:inline-flex;padding:4px;border-radius:999px;background:var(--sf2);gap:4px}
.sg{border:0;background:none;color:var(--mut);font:700 14px var(--fb);padding:8px 16px;border-radius:999px;cursor:pointer}
.sg.on{background:var(--sf);color:var(--ink);box-shadow:0 2px 6px rgba(30,10,100,.2)}
.kr .chip{padding:8px 12px;font-size:14px}
.cap{margin:10px 0 0;font-size:15px;color:var(--mut)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:10px -2px 0}
.pills .chip{flex:none;font-family:var(--fb)}

.hmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:14px}
.flm{display:inline-flex;align-items:center;gap:5px;padding:6px 13px 6px 9px;border-radius:999px;background:rgba(255,255,255,.2);font:700 14px var(--fb)}
.flm svg{width:17px;height:17px}
.gl{display:inline-flex;align-items:center;gap:5px;font:700 13px var(--fb)}.gl i{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.28);display:inline-block}.gl i.d{background:#fff}
.mt{text-align:center}
.mbpm{font:800 58px/1 var(--fd)}.mbpm small{font:700 14px var(--fb);color:var(--mut);margin-left:6px}
.mctl{display:flex;justify-content:center;gap:10px;margin-top:12px}
.rnd{width:50px;height:50px;border-radius:50%;border:0;background:var(--pris);color:var(--prit);font:700 15px var(--fm);cursor:pointer}
.rnd:active{transform:scale(.92)}
.mdot{width:28px;height:28px;border-radius:50%;background:var(--line);margin:14px auto 0}
.mdot.a{background:var(--dD)}.mdot.b{background:var(--dT)}.mdot.p{animation:pl .22s ease-out}
@keyframes pl{0%{transform:scale(1.6)}100%{transform:scale(1)}}
input[type=range]{width:100%;accent-color:var(--pri);margin-top:12px}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wdays i{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:700 12px var(--fm);font-style:normal;border:2px solid var(--line);color:var(--mut)}
.wdays i.d{background:var(--dP);border-color:var(--dP);color:#fff}.wdays i.t{border-color:var(--pri);color:var(--prit)}
.chart{display:block;width:100%;height:auto;margin-top:8px}
.chart text{font-family:var(--fm);fill:var(--mut);font-size:11px}
.chart .v{fill:var(--ink);font-weight:700;font-size:12px}
.cfgrow{margin-top:14px}.cfgrow b{display:block;margin-bottom:6px}
.sg2.wrap{flex-wrap:wrap;border-radius:22px}
/* Pasos de la sesión con nombre */
.stepper{display:flex;gap:6px;margin-top:16px}
.sp{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--mut);font:700 12px var(--fb);cursor:default;opacity:1}
.sp i{display:block;width:100%;height:8px;border-radius:999px;background:var(--line)}
.sp.d{color:var(--ink);cursor:pointer}.sp.d i{background:var(--dT)}
.sp.c{color:var(--ink)}.sp.c i{background:var(--c,var(--pri))}
/* Teoría en ideas cortas */
.keyc{margin-top:14px;padding:18px;border-radius:26px 26px 26px 8px;background:color-mix(in srgb,var(--g1) 12%,var(--sf));border:2px solid color-mix(in srgb,var(--g1) 32%,var(--line))}
.keyc .kl{font:700 12px var(--fb);letter-spacing:.09em;text-transform:uppercase;color:var(--prit)}
.keyc p{font-size:calc(19.5px*var(--z,1));line-height:1.5;margin:6px 0 0}
.ideas{list-style:none;padding:0;margin:4px 0 0;counter-reset:n}
.ideas li{position:relative;padding:14px 16px 14px 58px;margin-top:10px;background:var(--sf);border:1px solid var(--line);border-radius:20px;counter-increment:n}
.ideas li::before{content:counter(n);position:absolute;left:14px;top:12px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--pris);color:var(--prit);font:700 14px var(--fm)}

const keyOf=id=>{const m=/m$/.test(id)?1:0;for(const r of CROOTS){const k=kinfo(r,m);if(k.tn==id)return k}return null};
function demoFn(seq,kid){const cs=seq.filter(c=>c[0]!='~');if(!cs.length)return{};let K=kid?keyOf(kid):null;
if(!K){let best=null;for(const m of[0,1])for(const r of CROOTS){const k=kinfo(r,m),b=cs.map(baseC);if(b.every(c=>k.ch.includes(c)||k.V==c)){const sc=(b[0]==k.tn?2:0)+(b[b.length-1]==k.tn?1:0);if(!best||sc>best.sc)best={k,sc}}}if(best)K=best.k}
const o={};if(K)cs.forEach(c=>{o[c]=fnOf(K,baseC(c))||'X'});return o}
const FNAME={T:'Tónica',P:'Predominante',D:'Dominante'};
const legend=()=>`<div class=legend><span><i style="background:var(--dT)"></i>Tónica: casa, reposo</span><span><i style="background:var(--dP)"></i>Predominante: se aleja</span><span><i style="background:var(--dD)"></i>Dominante: tensión</span></div>`;
const legendX=()=>`<div class=legend><span><i style="background:transparent;border:2px dashed var(--d3)"></i>✱ Fuera de la tonalidad (acorde ajeno)</span></div>`;
let CF={r:'C',m:0,l:''},EXD='stair';
const scaleSeq=k=>{let prev=-1,oct=0;const o=k.notes.map((n,i)=>{const p=pcOf(n);if(i&&p<prev)oct=1;prev=p;return'~'+n+(oct?'+':'')});o.push('~'+k.notes[0]+'+');return o};
const rootMidi=k=>55+((pcOf(k.notes[0])+5)%12);
const IVM=[0,2,4,5,7,9,11,12],IVm=[0,2,3,5,7,8,10,12];
const fnChips=k=>`<div class=chips>${k.ch.map((c,i)=>`<button class="chip f${FN[i]}" data-a=pc data-v="${c}"><small>${k.rom[i]}</small>${esc(pretty(c))}<sup>${FN[i]}</sup></button>`).join('')}${k.V?`<button class="chip fD" data-a=pc data-v="${k.V}"><small>V</small>${esc(pretty(k.V))}<sup>D</sup></button>`:''}</div>`;

function fretD(k){const op=[64,59,55,50,45,40],nm=['e','B','G','D','A','E'],map={};k.notes.forEach(n=>map[pcOf(n)]=n);const x0=30,fw=30,y0=20,sy=20,NF=12,rp=pcOf(k.notes[0]);
let s=`<svg viewBox="0 0 ${x0+NF*fw+10} ${y0+5*sy+26}" role="img" aria-label="Notas de ${esc(k.name)} en el mástil">`;
for(let f=0;f<=NF;f++)s+=`<line x1="${x0+f*fw}" y1="${y0}" x2="${x0+f*fw}" y2="${y0+5*sy}" stroke="currentColor" stroke-opacity="${f?.3:.9}" stroke-width="${f?1:4}"/>`;
for(let i=0;i<6;i++)s+=`<line x1="${x0}" y1="${y0+i*sy}" x2="${x0+NF*fw}" y2="${y0+i*sy}" stroke="currentColor" stroke-opacity=".5" stroke-width="${1+i*.4}"/>`;
[3,5,7,9,12].forEach(f=>{s+=`<text x="${x0+(f-.5)*fw}" y="${y0+5*sy+19}" text-anchor="middle" font-size="11" style="opacity:.55">${f}</text>`});
op.forEach((m,i)=>{for(let f=0;f<=NF;f++){const mid=m+f,pc=mid%12;if(map[pc]==null)continue;const cx=f?x0+(f-.5)*fw:x0-14,cy=y0+i*sy,root=pc==rp;
s+=`<g class=nt data-a=nt data-v="${mid}"><circle cx="${cx}" cy="${cy}" r="9" style="fill:${root?'var(--dT)':'var(--g1)'}"/><text class=tx x="${cx}" y="${cy+3.8}" text-anchor="middle" font-size="10.5">${pretty(map[pc]).replace('♯','♯')}</text></g>`}});
return s+'</svg>'}

function stairD(k){const iv=k.m?IVm:IVM,names=k.notes.concat([k.notes[0]]),bw=44,gap=8,x0=6,base=186,h0=40,dh=14,W_=x0*2+8*bw+7*gap;
let s=`<svg viewBox="0 0 ${W_} ${base+28}" role="img" aria-label="Escalera de tonos y semitonos de ${esc(k.name)}">`;
names.forEach((n,i)=>{const x=x0+i*(bw+gap),h=h0+i*dh,y=base-h,root=i==0||i==7;
s+=`<g class=nt data-a=nn data-v="${i}"><rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="14" style="fill:${root?'var(--dT)':'var(--g1)'}"/><text class=tx x="${x+bw/2}" y="${y+24}" text-anchor="middle" font-size="15">${pretty(n)}</text></g>`;
s+=`<text x="${x+bw/2}" y="${base+18}" text-anchor="middle" font-size="12" style="opacity:.6">${i==7?'8':i+1}</text>`;
if(i<7){const d=iv[i+1]-iv[i],cx=x+bw+gap/2,cy=base-(h0+(i+1)*dh)-16,w=d==2?34:30;
s+=`<rect x="${cx-w/2}" y="${cy-11}" width="${w}" height="22" rx="11" style="fill:${d==2?'var(--d2)':'var(--dD)'}"/><text class=tx x="${cx}" y="${cy+4.5}" text-anchor="middle" font-size="12">${d==2?'T':'½'}</text>`}});
return s+'</svg>'}

function circD(){const R1=124,R2=80,c=160,sel=kinfo(CF.r,CF.m);
let s=`<svg viewBox="0 0 320 320" role="img" aria-label="Círculo de quintas"><circle cx="${c}" cy="${c}" r="${R1+25}" style="fill:var(--sf2)"/><circle cx="${c}" cy="${c}" r="${R2+22}" style="fill:var(--sf)"/>`;
CROOTS.forEach((r,i)=>{const a=(i*30-90)*Math.PI/180,co=Math.cos(a),si=Math.sin(a),on=CF.r==r;
const x1=c+R1*co,y1=c+R1*si,x2=c+R2*co,y2=c+R2*si,km=kinfo(r,1);
s+=`<g class=nt data-a=cn data-v="${i}:0"><circle cx="${x1.toFixed(1)}" cy="${y1.toFixed(1)}" r="21" style="fill:${on&&!CF.m?'var(--g1)':'var(--sf)'};stroke:${on?'var(--g1)':'var(--line)'};stroke-width:2"/><text x="${x1.toFixed(1)}" y="${(y1+5.5).toFixed(1)}" text-anchor="middle" font-size="16" font-weight="700" style="fill:${on&&!CF.m?'#fff':'var(--ink)'}">${pretty(r)}</text></g>`;
s+=`<g class=nt data-a=cn data-v="${i}:1"><circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="18" style="fill:${on&&CF.m?'var(--g2)':'var(--sf2)'};stroke:${on?'var(--g2)':'transparent'};stroke-width:2"/><text x="${x2.toFixed(1)}" y="${(y2+4.5).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:${on&&CF.m?'#fff':'var(--ink)'}">${pretty(km.tn)}</text></g>`});
const n=Math.abs(sel.sig);
s+=`<text x="${c}" y="${c+4}" text-anchor="middle" font-size="30" font-weight="700" style="fill:var(--ink)">${n}${sel.sig>0?'♯':sel.sig<0?'♭':''}</text><text x="${c}" y="${c+24}" text-anchor="middle" font-size="11" style="fill:var(--mut)">${n==0?'sin alteraciones':n==1?'alteración':'alteraciones'}</text>`;
return s+'</svg>'}

function funcD(k){const bw=128,gap=18,y0=26,rh=34,W_=3*bw+2*gap,H=232;
const grp=k.m?{T:[0,2,5],P:[3,1],D:[4,6]}:{T:[0,5,2],P:[3,1],D:[4,6]};
let s=`<svg viewBox="0 0 ${W_} ${H}" role="img" aria-label="Mapa de funciones de ${esc(k.name)}"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" style="fill:var(--mut)"/></marker></defs>`;
['T','P','D'].forEach((f,gi)=>{const x=gi*(bw+gap),col='var(--d'+f+')',list=grp[f].slice();
s+=`<rect x="${x}" y="0" width="${bw}" height="168" rx="26" style="fill:${col};opacity:.14"/><text x="${x+bw/2}" y="${y0-6}" text-anchor="middle" font-size="12.5" font-weight="700" style="fill:var(--f${f})">${FNAME[f].toUpperCase()}</text>`;
list.forEach((d,j)=>{const c=d==4&&k.m?k.V:k.ch[d],r=d==4&&k.m?'V':k.rom[d],y=y0+4+j*(rh+8);
s+=`<g class=nt data-a=pc data-v="${c}"><rect x="${x+12}" y="${y}" width="${bw-24}" height="${rh}" rx="17" style="fill:${col}"/><text class=tx x="${x+bw/2}" y="${y+22}" text-anchor="middle" font-size="14">${r}  ${pretty(c)}</text></g>`})});
[0,1].forEach(i=>{const x=(i+1)*bw+i*gap;s+=`<path d="M${x+2} 84H${x+gap-2}" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)" style="stroke:var(--mut);fill:none"/>`});
const xa=2*(bw+gap)+bw/2,xb=bw/2;
s+=`<path d="M${xa} 172C${xa} 222 ${xb} 222 ${xb} 174" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 6" marker-end="url(#ar)" style="stroke:var(--mut);fill:none"/><text x="${W_/2}" y="${H-24}" text-anchor="middle" font-size="12" style="fill:var(--mut)">vuelve a casa</text>`;
return s+'</svg>'}

function relD(){const a=kinfo(CF.r,0),b=kinfo(CF.r,1),sw=44,x0=6,y1=36,y2=132,bh=36;
let s=`<svg viewBox="0 0 408 190" role="img" aria-label="${esc(a.name)} y ${esc(b.name)} comparten notas"><text x="6" y="22" font-size="13" font-weight="700" style="fill:var(--ink)">${esc(a.name)}</text><text x="6" y="${y2-9}" font-size="13" font-weight="700" style="fill:var(--ink)">${esc(b.name)}</text>`;
const box=(sl,y,n,hot)=>`<rect x="${x0+sl*sw}" y="${y}" width="${sw-6}" height="${bh}" rx="12" style="fill:${hot?'var(--dT)':'var(--g1)'}"/><text class=tx x="${x0+sl*sw+(sw-6)/2}" y="${y+23}" text-anchor="middle" font-size="14">${pretty(n)}</text>`;
for(let sl=2;sl<=8;sl++){const n=a.N[(sl-2)%7];s+=box(sl,y1,n,sl==2)}
for(let sl=0;sl<=6;sl++){const n=b.notes[sl];s+=box(sl,y2,n,sl==0)}
for(let sl=2;sl<=6;sl++)s+=`<line x1="${x0+sl*sw+(sw-6)/2}" y1="${y1+bh}" x2="${x0+sl*sw+(sw-6)/2}" y2="${y2}" stroke-width="2" stroke-dasharray="2 5" style="stroke:var(--mut)"/>`;
[7,8].forEach(sl=>{s+=`<line x1="${x0+sl*sw+(sw-6)/2}" y1="${y1+bh}" x2="${x0+(sl-7)*sw+(sw-6)/2}" y2="${y2}" stroke-width="2" stroke-dasharray="2 5" style="stroke:var(--mut)"/>`});
s+=`<text x="204" y="${y2+bh+24}" text-anchor="middle" font-size="12" style="fill:var(--mut)">verde = nota de reposo (donde la música llega a casa)</text>`;
return s+'</svg>'}

const DGT={fret:'Mástil',stair:'Escalera',circ:'Círculo de quintas',fn:'Mapa de funciones',rel:'Relativas'};
const kpick=()=>`<div class=kp><div class=sg2><button class="sg${!CF.m?' on':''}" data-a=cm data-v=0>Mayor</button><button class="sg${CF.m?' on':''}" data-a=cm data-v=1>Menor</button></div><div class="chips kr">${CROOTS.map(r=>`<button class="chip${CF.r==r?' on':''}" data-a=ck data-v="${r}">${pretty(kinfo(r,CF.m).tn)}</button>`).join('')}</div></div>`;
function dgInner(id){const k=kinfo(CF.r,CF.m);let h=`<h2>${DGT[id]}</h2>`,svg='',cap='',extra='';
if(id=='fret'){h+=kpick();svg=fretD(k);cap=`Cada punto es una nota de ${k.name}. El verde es la nota de reposo. A la izquierda está el cejuelo (cuerdas al aire). Tocá un punto para oírlo.`;extra=`<button class="btn ghost sm" data-a=psc style="margin-top:12px">▶ Escuchar la escala</button>`}
else if(id=='stair'){h+=kpick();svg=stairD(k);cap=k.m?'La escala menor natural sube así: tono, semitono, tono, tono, semitono, tono, tono.':'La escala mayor sube con esta receta: tono, tono, semitono, tono, tono, tono, semitono.';extra=`<div class=legend><span><i style="background:var(--d2)"></i>T = tono (2 trastes)</span><span><i style="background:var(--dD)"></i>½ = semitono (1 traste)</span></div><button class="btn ghost sm" data-a=psc style="margin-top:12px">▶ Subir la escalera</button>`}
else if(id=='circ'){svg=circD();const n=Math.abs(k.sig);cap=`Cada paso a la derecha suma un sostenido; cada paso a la izquierda, un bemol. Afuera: tonalidades mayores. Adentro: su relativa menor. Tocá una para ver sus acordes.`;extra=`<p style="margin-top:12px"><b>${esc(k.name)}</b> · ${n==0?'sin alteraciones':n+' '+(k.sig>0?'sostenido':'bemol')+(n>1?'s':'')+': '+k.acc.map(pretty).join(', ')}</p>${fnChips(k)}<button class="btn ghost sm" data-a=pfn style="margin-top:12px">▶ Escuchar I–IV–V–I</button>`}
else if(id=='fn'){h+=kpick();svg=funcD(k);cap=`Los acordes de ${k.name} se agrupan por función. La música sale de casa (verde), se aleja (ámbar), crea tensión (coral) y vuelve. Tocá un acorde.`;extra=`<button class="btn ghost sm" data-a=pfn style="margin-top:12px">▶ Escuchar I–IV–V–I</button>`}
else{const a=kinfo(CF.r,0),b=kinfo(CF.r,1);h+=kpick();svg=relD();cap=`${a.name} y ${b.name} usan las mismas 7 notas. Lo único que cambia es cuál suena como casa.`;extra=`<div class=two style="justify-content:flex-start;margin-top:12px"><button class="btn sm" data-a=pc data-v="${a.ch[0]}">▶ ${esc(pretty(a.ch[0]))}</button><button class="btn sm" data-a=pc data-v="${b.ch[0]}">▶ ${esc(pretty(b.ch[0]))}</button></div>`}
return`${h}<div class="dgs${id=='fret'?' w':''}">${svg}</div><p class=cap>${cap}</p>${id=='fn'||id=='circ'?legend():''}${extra}`}
const dgCard=id=>`<div class="card dg" data-dg="${id}">${dgInner(id)}</div>`;
const refreshDG=()=>document.querySelectorAll('[data-dg]').forEach(e=>{e.innerHTML=dgInner(e.dataset.dg)});
const DG={'1.1':['stair','fret'],'1.2':['fn'],'1.3':['circ'],'1.4':['circ'],'1.5':['fn'],'2.1':['fn'],'2.2':['fn'],'2.3':['fn'],'2.4':['fn'],'2.5':['fn'],'3.1':['rel'],'3.2':['rel','stair'],'3.3':['fn'],'3.4':['fn'],'3.5':['rel']};
const DK={'1.3':['G',0],'1.4':['A',0],'3.1':['C',1],'3.2':['C',1],'3.3':['C',1],'3.4':['C',1],'3.5':['C',1]};


/* ===== Racha, meta semanal, metrónomo, ajustes ===== */
const ds=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dset=()=>{const s=new Set();S.logs.forEach(l=>l.d&&s.add(l.d));S.hist.forEach(h=>h.d&&s.add(h.d));return s};
function streak(){const s=dset(),d=new Date();let n=0;if(!s.has(ds(d)))d.setDate(d.getDate()-1);while(s.has(ds(d))&&n<2000){n++;d.setDate(d.getDate()-1)}return n}
function weekDays(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));const o=[];for(let i=0;i<7;i++){o.push(ds(d));d.setDate(d.getDate()+1)}return o}
const weekSess=()=>{const w=weekDays();return S.logs.filter(l=>w.includes(l.d)).length};
const goalN=()=>Math.max(1,Math.min(6,+S.cfg.goal||5));
function applyCfg(){try{const r=document.documentElement;r.style.setProperty('--z',[1,1.15,1.3][S.cfg.fs]||1);if(S.cfg.th=='light'||S.cfg.th=='dark')r.setAttribute('data-theme',S.cfg.th);else r.removeAttribute('data-theme')}catch(e){}}
let MT={on:0,bpm:80,beat:0,next:0,id:0};
function clickAt(t,acc){if(S.cfg.snd===false)return;const c=ac(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=acc?1600:1100;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.35,t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.08)}
function metTick(){const c=ac();while(MT.next<c.currentTime+.12){const acc=MT.beat%4==0,t=MT.next;clickAt(t,acc);setTimeout(()=>{const e=$('#mtd');if(e){e.className='mdot '+(acc?'a':'b');void e.offsetWidth;e.className+=' p'}},Math.max(0,(t-c.currentTime)*1000));MT.beat++;MT.next+=60/MT.bpm}}
function metStart(){try{const c=ac();MT.on=1;MT.beat=0;MT.next=c.currentTime+.05;metTick();clearInterval(MT.id);MT.id=setInterval(metTick,25)}catch(e){MT.on=0}}
function metStop(){MT.on=0;clearInterval(MT.id)}
const metHtml=()=>`<details class="card mt"${MT.on?' open':''}><summary><b>Metrónomo</b> <span class="m sm">· tocá para abrir</span></summary><div class=mbpm id=mbpm>${MT.bpm}<small>BPM</small></div><div class=mctl><button class=rnd data-a=bpm data-v=-5>−5</button><button class=rnd data-a=bpm data-v=-1>−1</button><button class=rnd data-a=bpm data-v=1>+1</button><button class=rnd data-a=bpm data-v=5>+5</button></div><input type=range id=mr min=40 max=200 value="${MT.bpm}" aria-label="Pulsos por minuto"><div class=mdot id=mtd></div><button class="btn${MT.on?' ghost':''}" data-a=met>${MT.on?'Parar':'Iniciar'}</button><p class="m sm">Cuatro tiempos. El primero suena más agudo. Empezá lento y subí de a poco.</p></details>`;
function testChart(ts){const W_=340,H=190,l=44,r=30,tp=24,b=34,n=ts.length,pts=ts.map((x,i)=>({x:n==1?(l+W_-r)/2:l+i*(W_-l-r)/(n-1),y:tp+(H-tp-b)*(1-pc(x.ok,x.n)/100),p:pc(x.ok,x.n),w:x.w,d:x.d}));
let s=`<svg class=chart viewBox="0 0 ${W_} ${H}" role="img" aria-label="Resultado de las pruebas de nivel">`;
[0,50,100].forEach(v=>{const y=tp+(H-tp-b)*(1-v/100);s+=`<line x1="${l}" y1="${y}" x2="${W_-r}" y2="${y}" stroke-width="1" style="stroke:var(--line)"/><text x="${l-6}" y="${y+4}" text-anchor="end">${v}%</text>`});
if(n>1){const path=pts.map((q,i)=>(i?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1)).join(' ');s+=`<path d="${path} L${pts[n-1].x.toFixed(1)} ${H-b} L${pts[0].x.toFixed(1)} ${H-b}z" style="fill:var(--d5);opacity:.14"/><path d="${path}" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--d5)"/>`}
pts.forEach((q,i)=>{const last=i==n-1;s+=`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${last?6:4}" style="fill:var(--d5);stroke:var(--sf);stroke-width:2"><title>Semana ${q.w}: ${q.p}%</title></circle>`;if(last||n<=4)s+=`<text class=v x="${q.x.toFixed(1)}" y="${(q.y-11).toFixed(1)}" text-anchor="middle">${q.p}%</text>`;s+=`<text x="${q.x.toFixed(1)}" y="${H-12}" text-anchor="middle">Sem. ${q.w}</text>`});
return s+'</svg>'}
const segc=(k,opts,cur)=>`<div class="sg2 wrap">${opts.map(([v,l])=>`<button class="sg${String(cur)==String(v)?' on':''}" data-a=cfg data-v="${k}:${v}">${l}</button>`).join('')}</div>`;
const cfgHtml=()=>`<details class=card><summary><b>Ajustes</b></summary><div class=cfgrow><b>Tamaño de letra</b>${segc('fs',[[0,'Normal'],[1,'Grande'],[2,'Muy grande']],S.cfg.fs)}</div><div class=cfgrow><b>Tema</b>${segc('th',[['auto','Automático'],['light','Claro'],['dark','Oscuro']],S.cfg.th)}</div><div class=cfgrow><b>Sonido</b>${segc('snd',[[1,'Activado'],[0,'Silenciado']],S.cfg.snd===false?0:1)}</div><div class=cfgrow><b>Meta semanal (sesiones)</b>${segc('goal',[[3,'3'],[4,'4'],[5,'5'],[6,'6']],goalN())}</div></details>`;

/* ===== Lecciones y sesión ===== */
const lk=()=>S.w+'.'+S.s,LS=()=>S.w&&S.s<6&&L[S.w-1]?L[S.w-1][S.s-1]:null;
function tasks(w,s){return W[w-1][3][s-1].split(' | ').map(x=>{const m=x.match(/^(\(Opcional\)\s*)?([AB]):\s*(.*)$/);return m?{b:m[2],t:m[3],o:!!m[1]}:{b:'·',t:x}})}
function steps(){if(!S.w)return['ini'];if(S.s==6)return['prueba','cierre'];return LS()?['teoria'].concat(DEMO[lk()]?['oir']:[],['q0','q1','q2','guit','cierre']):['guit','cierre']}
const SG={ini:'Inicio',teoria:'Teoría',oir:'Escuchar',q0:'Chequeo',q1:'Chequeo',q2:'Chequeo',guit:'Práctica',prueba:'Prueba',cierre:'Cierre'};
function stepper(st,cur){const g=[];st.forEach((id,i)=>{const n=SG[id],l=g[g.length-1];if(l&&l.n==n)l.to=i;else g.push({n,from:i,to:i})});
return`<div class=stepper>${g.map(x=>{const s=cur>x.to?'d':cur>=x.from?'c':'';return`<button class="sp ${s}" ${s=='d'?`data-a=go data-v=${x.from} aria-label="Volver a ${x.n}"`:'tabindex=-1'}><i></i>${x.n}</button>`}).join('')}</div>`}
const splitT=t=>Array.isArray(t)?t:t.replace(/\.\s+(?=[A-ZÁÉÍÓÚÑ¿(])/g,'.\n').split('\n');

function theoryHtml(l){const p=splitT(l[0]);return`<div class=keyc><span class=kl>Idea clave</span><p>${md(p[0])}</p></div>${p.length>1?`<ol class=ideas>${p.slice(1).map(x=>`<li>${md(x)}</li>`).join('')}</ol>`:''}`}

if(id=='guit'){const tx=TX[lk()],t=tx?tx.map(k=>`<div class=card><div class=bh><span class="bl ${k[0]}">${k[0]}</span><b>${md(k[1])}</b>${tmb(k[0])}</div><ul class=stl>${k[2].map((p,i)=>{const key=lk()+k[0]+i;return`<li class="${TK[key]?'on':''}" data-a=tk data-v="${key}"><span class=cb>${TK[key]?'✓':''}</span><span class=tx2>${md(p)}</span></li>`}).join('')}</ul></div>`).join(''):tasks(w,s).map(k=>`<div class=task><span class="bl ${k.b}">${k.b}</span><p style="margin:0">${k.o?'<span class=m>(Opcional) </span>':''}${esc(k.t)}</p></div>`).join('');return`<span class=eyebrow>Con la guitarra</span><h1>Práctica de hoy</h1><p class=sub>Bloque A (20 min): teoría tocada en la guitarra. Bloque B (25 min): oído y canciones. Hacé los pasos en orden y tocá cada uno para tacharlo. El botón ▶ de cada bloque inicia su reloj.</p>${t}${metHtml()}${tx?'':`<p class=m>Estas instrucciones están resumidas.${HT()?' Si no entendés alguna, preguntale al tutor.':' Si no entendés alguna palabra, mirá el glosario de arriba.'}</p>${HT()?'<button class="btn ghost" data-a=askl>Preguntarle al tutor</button>':''}`}<button class="btn ghost" data-a=dstart data-v=${WD[w]}>Practicar 10 preguntas: ${esc(DN[WD[w]])}</button>${GLO}${nextBtn('Terminar la práctica')}`}

${first?'<button class=btn data-a=st0>Empezar la semana 1</button>':''}${e&&!QS.review?`<button class="btn${first?' ghost':''}" data-a=rev>Repasar mis errores (${e})</button>`:''}<button class="btn${first||(e&&!QS.review)?' ghost':''}" data-a=qagain>Repetir</button><button class="btn ghost" data-a=qexit>Volver</button></div>`}

<div class=qcard><span class=eyebrow>${QS.test?'Prueba de nivel':esc(dn(QS.d))} · ${QS.i+1}/${n}</span>${QS.i==0&&!QS.test&&DD[QS.d]?`<p class="m sm" style="margin:10px 0 0">${esc(DD[QS.d])}</p>`:''}<h1 class=q>${esc(q.t)}</h1>${q.play?'<button class="btn ghost sm" style="margin-top:12px" data-a=qp>▶ Escuchar de nuevo</button>':''}</div>

setInterval(updTimer,500);

/* ===== Tutor ===== */
async function ask(){const q=(TD||'').trim();if(!q)return;TC.push(['u',q],['t','Pensando…']);TD='';R();
try{const sm=await window.claude.use('sample');if(!sm)throw 0;const l=LS(),h=TC.slice(-8,-2).map(m=>(m[0]=='u'?'Alumno: ':'Tutor: ')+m[1]).join('\n');
const r=await sm('Sos un tutor de guitarra y teoría musical (pop y rock en español) para un alumno adulto de nivel básico a intermedio. Respondé en español rioplatense con voseo, en un máximo de 120 palabras, con precisión. Si no estás seguro, decilo e indicá tu nivel de confianza. No inventes datos de canciones. Si el alumno manda un análisis, evaluá su hipótesis, señalá lo que esté mal y explicá por qué. Contexto: semana '+S.w+', sesión '+S.s+(S.w&&W[S.w-1]?' ('+W[S.w-1][0]+')':'')+'. Teoría de la lección de hoy: '+(l?l[0]:'(no hay lección escrita para hoy)')+'\nHistorial:\n'+h+'\nAlumno: '+q,{cache:false});TC[TC.length-1]=['t',r.text]}
catch(e){TC[TC.length-1]=['t','El tutor no está disponible ahora (falta el permiso o se alcanzó el límite de uso).']}R()}

/* ===== Acciones ===== */
const playN=m=>{try{ac();pluck(mf(m),AC.currentTime+.02,1.3,.28)}catch(e){}};
const A={
tab:v=>{metStop();tab=v;R();window.scrollTo(0,0)},
gs:v=>{const[w,s]=v.split(':').map(Number);metStop();S.w=w;S.s=s;save();view='main';ST={k:'',i:0,a:[],r:0,so:''};tab='est';R();window.scrollTo(0,0)},
met:()=>{if(MT.on)metStop();else metStart();R()},
bpm:v=>{MT.bpm=Math.max(40,Math.min(200,MT.bpm+ +v));const e=$('#mbpm'),r=$('#mr');if(e&&e.firstChild)e.firstChild.textContent=MT.bpm;if(r)r.value=MT.bpm},
cfg:v=>{const[k,x]=v.split(':');if(k=='th')S.cfg.th=x;else if(k=='snd')S.cfg.snd=x=='1';else S.cfg[k]=+x;save();applyCfg();R()},
plan:()=>{metStop();view='plan';R();window.scrollTo(0,0)},planx:()=>{view='main';R()},
gw:v=>{S.w=+v;S.s=1;save();view='main';ST={k:'',i:0,a:[],r:0,so:''};tab='est';R();window.scrollTo(0,0)},
st0:()=>{S.w=1;S.s=1;save();QS=null;view='main';tab='est';ST={k:'',i:0,a:[],r:0,so:''};R();window.scrollTo(0,0)},
nx:()=>{metStop();ST.i++;R();window.scrollTo(0,0)},back:()=>{metStop();ST.i=Math.max(0,ST.i-1);R();window.scrollTo(0,0)},
rq:()=>{ST.a=[];ST.i=steps().indexOf('q0');R();window.scrollTo(0,0)},
lq:v=>{const[i,j]=v.split(':').map(Number),q=LS()[1][i];if(ST.a[i])return;ST.a[i]=[j,j==q[2]];if(ST.a.filter(Boolean).length==3){S.q[lk()]=Math.max(S.q[lk()]||0,ST.a.filter(k=>k[1]).length);save()}R()},
chip:v=>{const[j,i]=v.split(':').map(Number),c=DEMO[lk()][j][1][i];SEL=c[0]=='~'?null:c;try{stopSeq();ac();playOne(c,AC.currentTime+.02,1.8)}catch(e){}const e=$('#shp');if(e)e.innerHTML=shapeHtml(SEL)},
plays:v=>{const d=DEMO[lk()][+v];playSeq(d[1],d[1][0][0]=='~'?.5:1.2,'#dm'+v)},
tb:v=>{if(T.blk!=v){T.blk=v;T.base=T.left=BDUR[v];T.run=0}if(T.run){T.run=0;T.base=T.left}else{if(!T.left)T.base=T.left=BDUR[v];T.base=T.left;T.run=1;T.t0=Date.now()}updTimer()},
tk:(v,b)=>{TK[v]=!TK[v];b.classList.toggle('on',TK[v]);const c=b.querySelector('.cb');if(c)c.textContent=TK[v]?'✓':''},
go:v=>{metStop();ST.i=+v;R();window.scrollTo(0,0)},
cr:(v,b)=>{S.crit[S.w]=b.checked;save()},rc:(v,b)=>{S.rec[S.w]=b.checked;save()},
rate:v=>{ST.r=+v;R()},fin:()=>{if(ST.r)finish()},
startTest:()=>startQuiz('nivel'),dstart:v=>startQuiz(v,10),rev:()=>startReview(),
qa:v=>{const q=QS.l[QS.i];if(QS.ans!=null)return;const ok=+v==q.a;QS.ans=+v;QS.res.push(ok);if(ok){QS.cmb++;QS.best=Math.max(QS.best,QS.cmb)}else QS.cmb=0;if(QS.review)errRes(q,ok);else if(!ok)errAdd(q);save();R()},
qn:()=>{if(QS.i<QS.l.length-1){QS.i++;QS.ans=null;R();window.scrollTo(0,0);setTimeout(autoPlay,200)}else finishQuiz()},
qh:()=>{QS.help=!QS.help;R()},
qp:()=>{const q=QS.l[QS.i];playSeq(q.play,q.play.length==1?1.6:1.1,'#nohl')},
qagain:()=>{if(QS.review)startReview();else startQuiz(QS.d,10)},qexit:()=>{stopSeq();QS=null;R();window.scrollTo(0,0)},
askl:()=>{TD=LS()?'No entiendo esta parte de la lección: ':'Necesito que me expliques la teoría de esta semana: ';tab='tut';R();window.scrollTo(0,0)},
qk:v=>{TD={1:'Explicame la lección de hoy con otras palabras.',2:'Dame un ejemplo concreto de la lección de hoy.',3:'Corregí mi análisis. Tonalidad: … Grados: … Confianza: …'}[v];R()},
ask:ask,
exd:v=>{EXD=v;R()},ck:v=>{CF.r=v;refreshDG()},cm:v=>{CF.m=+v;refreshDG()},
cn:v=>{const[i,m]=v.split(':').map(Number);CF.r=CROOTS[i];CF.m=m;refreshDG();const k=kinfo(CF.r,CF.m);try{stopSeq();ac();playOne(k.ch[0],AC.currentTime+.02,1.6)}catch(e){}},
nt:v=>playN(+v),nn:v=>{const k=kinfo(CF.r,CF.m);playN(rootMidi(k)+(k.m?IVm:IVM)[+v])},
pc:v=>{try{stopSeq();ac();playOne(v,AC.currentTime+.02,1.8)}catch(e){}},
psc:(v,b)=>{const k=kinfo(CF.r,CF.m),e=b&&b.closest&&b.closest('[data-dg]'),st=e&&e.dataset.dg=='stair';playSeq(scaleSeq(k),.45,st?'[data-dg=stair]':'#nohl')},
pfn:()=>{const k=kinfo(CF.r,CF.m);playSeq([k.ch[0],k.ch[3],k.m?k.V:k.ch[4],k.ch[0]],1.1,'#nohl')},
t4s:()=>{const a=+$('#t4a').value,n=+$('#t4n').value;if(!n||a<0||a>n)return;S.t4.push({d:today(),w:S.w,a,n,c:$('#t4c').value});save();R()},
cp:()=>{const t=$('#js');t.select();try{navigator.clipboard.writeText(t.value).catch(()=>{})}catch(e){}$('#ms').textContent='Copiado. Si no se copió, seleccioná el texto y copialo a mano.'},
im:()=>{try{const o=JSON.parse($('#js').value);if(!o||!Array.isArray(o.logs))throw 0;S=Object.assign(DEF(),o);if(!Array.isArray(S.tests))S.tests=[];if(!Array.isArray(S.t4))S.t4=[];if(!Array.isArray(S.hist))S.hist=[];if(!Array.isArray(S.err))S.err=[];S.cfg=Object.assign({fs:0,th:'auto',snd:true,goal:5},S.cfg&&typeof S.cfg=='object'?S.cfg:{});save();applyCfg();ST={k:'',i:0,a:[],r:0,so:''};R();$('#ms')&&($('#ms').textContent='Importado.')}catch(e){$('#ms').textContent='El texto no es un respaldo válido.'}},
wp:()=>{if(!wipe){wipe=1;$('#ms').textContent='Tocá "Borrar todo" otra vez para confirmar.';return}wipe=0;S=DEF();save();applyCfg();ST={k:'',i:0,a:[],r:0,so:''};QS=null;R()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v,b)});
document.addEventListener('input',e=>{if(e.target.id=='tq')TD=e.target.value;if(e.target.id=='mr'){MT.bpm=+e.target.value;const m=$('#mbpm');if(m&&m.firstChild)m.firstChild.textContent=MT.bpm}if(e.target.id=='so')ST.so=e.target.value});
applyCfg();R();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}

</script>
